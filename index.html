<script type="module">
    import { app } from "./firebase.js";
    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const database = getDatabase(app);

    /* =========================
       CONFIG
    ========================= */

    const WORKER_URL = "https://rotierlist-minecraft.denizzzezw.workers.dev";

    const TIER_SCORE = {
        "HT1": 100,
        "LT1": 90,
        "HT2": 80,
        "LT2": 70,
        "HT3": 60,
        "LT3": 50,
        "HT4": 40,
        "LT4": 30,
        "HT5": 20,
        "LT5": 10,
        "Unranked": 0
    };

    const GAMEMODE = "sword";

    /* =========================
       ELEMENTS
    ========================= */

    const podium = document.getElementById("podium");
    const leaderboardBody = document.getElementById("leaderboardBody");
    const searchInput = document.getElementById("searchInput");

    const playersCount = document.getElementById("playersCount");
    const rankedCount = document.getElementById("rankedCount");
    const testsCount = document.getElementById("testsCount");
    const testersCount = document.getElementById("testersCount");

    let allPlayers = [];

    /* =========================
       HELPERS
    ========================= */

    function getTierScore(tier) {
        return TIER_SCORE[tier] || 0;
    }

    function getSkin(uuid) {
        if (!uuid) {
            return "https://mc-heads.net/avatar/MHF_Steve/64";
        }

        return `https://mc-heads.net/avatar/${uuid.replace(/-/g, "")}/64`;
    }

    function getBody(uuid) {
        if (!uuid) {
            return "https://mc-heads.net/body/MHF_Steve/100";
        }

        return `https://mc-heads.net/body/${uuid.replace(/-/g, "")}/100`;
    }

    function getTierClass(tier) {
        if (!tier || tier === "Unranked") {
            return "unranked";
        }

        return tier.toLowerCase().replace(" ", "");
    }

    function escapeHTML(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function getTier(player) {
        return player?.tiers?.[GAMEMODE] || "Unranked";
    }

    /* =========================
       SORT PLAYERS
    ========================= */

    function getRankedPlayers() {
        return allPlayers
            .filter(player => {
                if (!player) return false;

                // Homepage = PREMIUM leaderboard
                if (player.accountType !== "premium") {
                    return false;
                }

                const tier = getTier(player);

                return tier !== "Unranked";
            })
            .sort((a, b) => {
                const tierA = getTier(a);
                const tierB = getTier(b);

                const scoreA = getTierScore(tierA);
                const scoreB = getTierScore(tierB);

                if (scoreB !== scoreA) {
                    return scoreB - scoreA;
                }

                const testsA = Number(a?.stats?.tests || 0);
                const testsB = Number(b?.stats?.tests || 0);

                return testsB - testsA;
            });
    }

    /* =========================
       PODIUM
    ========================= */

    function renderPodium(players) {
        if (!podium) return;

        const top3 = players.slice(0, 3);

        if (top3.length === 0) {
            podium.innerHTML = `
                <div class="empty-leaderboard">
                    <div class="empty-icon">🏆</div>
                    <h3>No ranked players yet</h3>
                    <p>Be the first player to get ranked.</p>
                </div>
            `;

            return;
        }

        podium.innerHTML = top3.map((player, index) => {
            const position = index + 1;
            const name = escapeHTML(
                player.minecraftName || "Unknown"
            );

            const tier = getTier(player);
            const uuid = player.uuid || "";
            const score = getTierScore(tier);

            return `
                <div class="podium-card place-${position}">
                    <div class="podium-rank">
                        #${position}
                    </div>

                    <div class="podium-player">
                        <img
                            src="${getBody(uuid)}"
                            alt="${name}"
                            class="podium-skin"
                            onerror="this.src='https://mc-heads.net/body/MHF_Steve/100'"
                        >

                        <div class="podium-name">
                            ${name}
                        </div>

                        <div class="podium-tier ${getTierClass(tier)}">
                            ${escapeHTML(tier)}
                        </div>

                        <div class="podium-score">
                            ${score} pts
                        </div>
                    </div>
                </div>
            `;
        }).join("");
    }

    /* =========================
       LEADERBOARD ROWS
    ========================= */

    function renderRows(players) {
        if (!leaderboardBody) return;

        const top50 = players.slice(3, 50);

        if (top50.length === 0) {
            leaderboardBody.innerHTML = `
                <div class="empty-row">
                    No other ranked players.
                </div>
            `;

            return;
        }

        leaderboardBody.innerHTML = top50.map((player, index) => {
            const position = index + 4;

            const name = escapeHTML(
                player.minecraftName || "Unknown"
            );

            const tier = getTier(player);
            const uuid = player.uuid || "";

            const tests = Number(
                player?.stats?.tests || 0
            );

            const wins = Number(
                player?.stats?.wins || 0
            );

            const losses = Number(
                player?.stats?.losses || 0
            );

            const score = getTierScore(tier);

            return `
                <div class="leaderboard-row">

                    <div class="rank-number">
                        #${position}
                    </div>

                    <div class="player-cell">
                        <img
                            src="${getSkin(uuid)}"
                            alt="${name}"
                            class="player-skin"
                            onerror="this.src='https://mc-heads.net/avatar/MHF_Steve/64'"
                        >

                        <div class="player-info">
                            <div class="player-name">
                                ${name}
                            </div>

                            <div class="player-region">
                                ${escapeHTML(player.region || "EU")}
                            </div>
                        </div>
                    </div>

                    <div class="tier-cell">
                        <span class="tier-badge ${getTierClass(tier)}">
                            ${escapeHTML(tier)}
                        </span>
                    </div>

                    <div class="score-cell">
                        ${score}
                    </div>

                    <div class="tests-cell">
                        ${tests}
                    </div>

                    <div class="record-cell">
                        ${wins}W / ${losses}L
                    </div>

                </div>
            `;
        }).join("");
    }

    /* =========================
       STATS
    ========================= */

    function renderStats(players) {
        if (playersCount) {
            playersCount.textContent = players.length;
        }

        const ranked = players.filter(player => {
            if (!player) return false;

            if (player.accountType !== "premium") {
                return false;
            }

            return getTier(player) !== "Unranked";
        });

        if (rankedCount) {
            rankedCount.textContent = ranked.length;
        }

        const totalTests = players.reduce((total, player) => {
            return total + Number(
                player?.stats?.tests || 0
            );
        }, 0);

        if (testsCount) {
            testsCount.textContent = totalTests;
        }

        if (testersCount) {
            testersCount.textContent = "0";
        }
    }

    /* =========================
       SEARCH
    ========================= */

    function searchPlayers(query) {
        const value = query
            .trim()
            .toLowerCase();

        if (!value) {
            return getRankedPlayers();
        }

        return getRankedPlayers().filter(player => {
            const name = String(
                player.minecraftName || ""
            ).toLowerCase();

            return name.includes(value);
        });
    }

    function renderLeaderboard(players) {
        renderPodium(players);
        renderRows(players);
    }

    /* =========================
       FIREBASE REALTIME DATABASE
    ========================= */

    const playersRef = ref(database, "players");

    onValue(
        playersRef,
        snapshot => {
            const data = snapshot.val() || {};

            allPlayers = Object.entries(data)
                .map(([uid, player]) => ({
                    uid,
                    ...player
                }))
                .filter(player => player.minecraftName);

            const rankedPlayers = getRankedPlayers();

            renderLeaderboard(rankedPlayers);
            renderStats(allPlayers);

            console.log(
                "[ROTierList] Players loaded:",
                allPlayers.length
            );

            console.log(
                "[ROTierList] Ranked premium players:",
                rankedPlayers.length
            );
        },
        error => {
            console.error(
                "[ROTierList] Firebase error:",
                error
            );

            if (podium) {
                podium.innerHTML = `
                    <div class="empty-leaderboard">
                        <div class="empty-icon">⚠️</div>
                        <h3>Leaderboard unavailable</h3>
                        <p>Could not load player data.</p>
                    </div>
                `;
            }

            if (leaderboardBody) {
                leaderboardBody.innerHTML = `
                    <div class="empty-row">
                        Could not load leaderboard data.
                    </div>
                `;
            }
        }
    );

    /* =========================
       SEARCH EVENT
    ========================= */

    if (searchInput) {
        searchInput.addEventListener("input", event => {
            const results = searchPlayers(
                event.target.value
            );

            renderLeaderboard(results);
        });
    }

    /* =========================
       ENTER SEARCH
    ========================= */

    if (searchInput) {
        searchInput.addEventListener("keydown", event => {
            if (event.key !== "Enter") return;

            const query = searchInput.value.trim();

            if (!query) return;

            const player = allPlayers.find(p => {
                return String(
                    p.minecraftName || ""
                ).toLowerCase() === query.toLowerCase();
            });

            if (player) {
                window.location.href =
                    `./players.html?player=${encodeURIComponent(player.minecraftName)}`;
            }
        });
    }
</script>
