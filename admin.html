<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RO TierList | Admin</title>

    <style>

        :root {
            --bg: #07070b;
            --panel: #101016;
            --panel2: #0c0c11;
            --border: #292934;
            --purple: #815cff;
            --purple2: #a184ff;
            --text: #f5f5f7;
            --muted: #858597;
            --green: #4ade80;
            --red: #ff7070;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(129,92,255,.14),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .page {
            width: min(900px, 94%);
            margin: auto;
            padding: 60px 0 100px;
        }

        .top {
            margin-bottom: 35px;
        }

        .eyebrow {
            color: var(--purple2);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: -3px;
            font-weight: 900;
        }

        .subtitle {
            margin-top: 10px;
            color: var(--muted);
            font-size: 14px;
        }

        .admin-card {
            padding: 28px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: rgba(16,16,22,.88);
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #a4a4b5;

            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        select {

            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 10px;

            outline: none;

            background: var(--panel2);
            color: white;

            font-family: inherit;
            font-size: 13px;

        }

        input:focus,
        select:focus {
            border-color: var(--purple);

            box-shadow:
                0 0 0 3px
                rgba(129,92,255,.08);
        }

        .player-preview {

            display: none;

            align-items: center;
            gap: 13px;

            margin-top: 10px;
            padding: 11px;

            border: 1px solid #292934;
            border-radius: 10px;

            background: #0b0b10;

        }

        .player-preview.show {
            display: flex;
        }

        .player-preview img {

            width: 42px;
            height: 42px;

            border-radius: 8px;

            image-rendering: pixelated;

        }

        .preview-name {
            font-size: 13px;
            font-weight: 900;
        }

        .preview-type {
            margin-top: 4px;

            color: var(--muted);

            font-size: 10px;
        }

        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 8px;

        }

        .save {

            width: 100%;
            height: 50px;

            margin-top: 10px;

            border: 0;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #815cff,
                    #633fe0
                );

            color: white;

            font-family: inherit;

            font-size: 13px;
            font-weight: 900;

            cursor: pointer;

            transition: .2s;

        }

        .save:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 30px
                rgba(129,92,255,.25);
        }

        .message {

            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 12px;
            font-weight: 800;

        }

        .message.success {
            color: var(--green);
        }

        .message.error {
            color: var(--red);
        }

        .locked {

            padding: 50px;

            text-align: center;

            border: 1px solid #332323;
            border-radius: 18px;

            background: #120d0d;

        }

        .locked h2 {
            margin-bottom: 8px;
        }

        .locked p {
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 40px;
            }

            .admin-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="top">

        <div class="eyebrow">
            RO TIERLIST
        </div>

        <h1>Admin Panel</h1>

        <p class="subtitle">
            Manage players, tiers and PvP statistics.
        </p>

    </div>


    <div id="locked" class="locked">

        <h2>Checking access...</h2>

        <p>
            Please wait.
        </p>

    </div>


    <div
        id="adminPanel"
        class="admin-card"
        style="display:none;"
    >

        <div class="field">

            <label>
                Minecraft Player
            </label>

            <input
                id="playerSearch"
                type="text"
                list="playerNames"
                placeholder="Type a Minecraft username..."
                autocomplete="off"
            >

            <datalist id="playerNames"></datalist>


            <div
                id="playerPreview"
                class="player-preview"
            ></div>

        </div>


        <div class="grid">

            <div class="field">

                <label>
                    Gamemode
                </label>

                <select id="gamemode">

                    <option value="vanilla">
                        Vanilla
                    </option>

                    <option value="sword">
                        Sword
                    </option>

                    <option value="axe">
                        Axe
                    </option>

                    <option value="uhc">
                        UHC
                    </option>

                    <option value="pot">
                        Pot
                    </option>

                    <option value="mace">
                        Mace
                    </option>

                    <option value="smp">
                        SMP
                    </option>

                    <option value="crystal">
                        Crystal
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Tier
                </label>

                <select id="tier">

                    <option value="Unranked">
                        Unranked
                    </option>

                    <option value="LT5">
                        LT5
                    </option>

                    <option value="HT5">
                        HT5
                    </option>

                    <option value="LT4">
                        LT4
                    </option>

                    <option value="HT4">
                        HT4
                    </option>

                    <option value="LT3">
                        LT3
                    </option>

                    <option value="HT3">
                        HT3
                    </option>

                    <option value="LT2">
                        LT2
                    </option>

                    <option value="HT2">
                        HT2
                    </option>

                    <option value="LT1">
                        LT1
                    </option>

                    <option value="HT1">
                        HT1
                    </option>

                </select>

            </div>

        </div>


        <div class="stats">

            <div class="field">

                <label>
                    Tests
                </label>

                <input
                    id="tests"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="field">

                <label>
                    Wins
                </label>

                <input
                    id="wins"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="field">

                <label>
                    Losses
                </label>

                <input
                    id="losses"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>

        </div>


        <button
            id="saveButton"
            class="save"
        >
            Save Player
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const OWNER_EMAIL =
    "denizzzezw@gmail.com";


const database =
    getDatabase();


const locked =
    document.getElementById("locked");


const adminPanel =
    document.getElementById("adminPanel");


const playerSearch =
    document.getElementById("playerSearch");


const playerNames =
    document.getElementById("playerNames");


const playerPreview =
    document.getElementById("playerPreview");


const gamemode =
    document.getElementById("gamemode");


const tier =
    document.getElementById("tier");


const tests =
    document.getElementById("tests");


const wins =
    document.getElementById("wins");


const losses =
    document.getElementById("losses");


const saveButton =
    document.getElementById("saveButton");


const message =
    document.getElementById("message");


let players = {};

let selectedPlayer = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    user => {

        if (!user) {

            locked.innerHTML = `
                <h2>Login required</h2>
                <p>
                    You must be logged in to access the Admin Panel.
                </p>
            `;

            return;
        }


        if (
            String(user.email || "").toLowerCase()
            !==
            OWNER_EMAIL.toLowerCase()
        ) {

            locked.innerHTML = `
                <h2>Access denied</h2>
                <p>
                    You don't have permission to access this panel.
                </p>
            `;

            return;
        }


        locked.style.display = "none";

        adminPanel.style.display = "block";


        loadPlayers();

    }
);


/* =========================
   LOAD ALL PLAYERS
========================= */

function loadPlayers() {

    onValue(
        ref(database, "players"),
        snapshot => {

            players =
                snapshot.val() || {};

            populatePlayerList();

            findPlayer();

        },
        error => {

            console.error(error);

            showMessage(
                "Could not load players.",
                "error"
            );

        }
    );

}


/* =========================
   DATAlIST
========================= */

function populatePlayerList() {

    playerNames.innerHTML = "";


    Object.values(players)
        .sort((a, b) => {

            const nameA =
                String(
                    a?.minecraftName || ""
                ).toLowerCase();

            const nameB =
                String(
                    b?.minecraftName || ""
                ).toLowerCase();

            return nameA.localeCompare(nameB);

        })
        .forEach(player => {

            if (!player?.minecraftName) {
                return;
            }


            const option =
                document.createElement("option");


            option.value =
                player.minecraftName;


            playerNames.appendChild(option);

        });

}


/* =========================
   LIVE PLAYER FIND
========================= */

playerSearch.addEventListener(
    "input",
    findPlayer
);


playerSearch.addEventListener(
    "change",
    findPlayer
);


function findPlayer() {

    const value =
        playerSearch.value
            .trim()
            .toLowerCase();


    selectedPlayer = null;

    playerPreview.classList.remove("show");


    if (!value) {
        return;
    }


    const entries =
        Object.entries(players);


    /*
     * FIRST:
     * exact username
     */

    let match =
        entries.find(
            ([uid, player]) =>
                String(
                    player?.minecraftName || ""
                ).toLowerCase()
                ===
                value
        );


    /*
     * SECOND:
     * username that starts with text
     */

    if (!match) {

        match =
            entries.find(
                ([uid, player]) =>
                    String(
                        player?.minecraftName || ""
                    ).toLowerCase()
                    .startsWith(value)
            );

    }


    /*
     * THIRD:
     * username containing text
     */

    if (!match) {

        match =
            entries.find(
                ([uid, player]) =>
                    String(
                        player?.minecraftName || ""
                    ).toLowerCase()
                    .includes(value)
            );

    }


    if (!match) {

        return;
    }


    const [uid, player] =
        match;


    selectedPlayer = {
        uid,
        ...player
    };


    showPlayer(
        selectedPlayer
    );


    loadPlayerData(
        selectedPlayer
    );

}


/* =========================
   SHOW PLAYER
========================= */

function showPlayer(player) {

    const uuid =
        String(
            player.uuid || ""
        ).replaceAll("-", "");


    const skin =
        uuid
            ? `https://mc-heads.net/avatar/${uuid}/64`
            : "";


    playerPreview.innerHTML = `

        ${
            skin
                ? `
                    <img
                        src="${skin}"
                        alt=""
                    >
                `
                : ""
        }

        <div>

            <div class="preview-name">
                ${player.minecraftName || "Unknown"}
            </div>

            <div class="preview-type">
                ${
                    player.accountType ||
                    "Unknown account"
                }
            </div>

        </div>

    `;


    playerPreview.classList.add("show");

}


/* =========================
   LOAD PLAYER DATA
========================= */

function loadPlayerData(player) {

    const tiers =
        player.tiers || {};


    const stats =
        player.stats || {};


    const mode =
        gamemode.value;


    const existingKey =
        Object.keys(tiers)
            .find(
                key =>
                    key.toLowerCase()
                    ===
                    mode.toLowerCase()
            );


    tier.value =
        existingKey
            ? tiers[existingKey] || "Unranked"
            : "Unranked";


    tests.value =
        Number(stats.tests || 0);


    wins.value =
        Number(stats.wins || 0);


    losses.value =
        Number(stats.losses || 0);

}


/* =========================
   GAMEMODE CHANGE
========================= */

gamemode.addEventListener(
    "change",
    () => {

        if (!selectedPlayer) {
            return;
        }


        loadPlayerData(
            selectedPlayer
        );

    }
);


/* =========================
   SAVE
========================= */

saveButton.addEventListener(
    "click",
    async () => {

        if (!selectedPlayer) {

            showMessage(
                "Type an existing Minecraft username first.",
                "error"
            );

            return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        try {

            const newTiers = {
                ...(selectedPlayer.tiers || {})
            };


            const existingKey =
                Object.keys(newTiers)
                    .find(
                        key =>
                            key.toLowerCase()
                            ===
                            gamemode.value.toLowerCase()
                    );


            const tierKey =
                existingKey ||
                gamemode.value;


            newTiers[tierKey] =
                tier.value;


            const newStats = {

                tests:
                    Math.max(
                        0,
                        Number(tests.value || 0)
                    ),

                wins:
                    Math.max(
                        0,
                        Number(wins.value || 0)
                    ),

                losses:
                    Math.max(
                        0,
                        Number(losses.value || 0)
                    )

            };


            await update(
                ref(
                    database,
                    `players/${selectedPlayer.uid}`
                ),
                {
                    tiers: newTiers,
                    stats: newStats
                }
            );


            selectedPlayer.tiers =
                newTiers;


            selectedPlayer.stats =
                newStats;


            showMessage(
                `${selectedPlayer.minecraftName} updated successfully.`,
                "success"
            );


        } catch (error) {

            console.error(
                "Save error:",
                error
            );


            showMessage(
                "Could not save player. Check Firebase Rules.",
                "error"
            );

        } finally {

            saveButton.disabled = false;

            saveButton.textContent =
                "Save Player";

        }

    }
);


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        `message ${type}`;

}

</script>

</body>
</html>
