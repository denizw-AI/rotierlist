<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | RO TierList</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(124, 77, 255, 0.10),
                    transparent 35%
                ),
                #050509;
            color: #f5f5f7;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .page {
            width: min(1010px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 70px;
        }

        .brand {
            color: #875cff;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(48px, 7vw, 72px);
            line-height: 0.95;
            letter-spacing: -4px;
            font-weight: 950;
        }

        .subtitle {
            margin-top: 18px;
            color: #8f8f9d;
            font-size: 16px;
        }

        .panel {
            margin-top: 40px;
            background: rgba(16, 16, 22, 0.92);
            border: 1px solid #292932;
            border-radius: 22px;
            padding: 32px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35);
        }

        .section-title {
            margin-bottom: 10px;
            color: #a7a7b5;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            height: 54px;
            padding: 0 16px;

            border-radius: 12px;
            border: 1px solid #30303a;

            background: #0b0b10;
            color: #fff;

            outline: none;
            font-size: 15px;
            font-weight: 600;

            transition: 0.15s ease;
        }

        input:focus,
        select:focus {
            border-color: #7650ff;
            box-shadow:
                0 0 0 3px rgba(118, 80, 255, 0.10);
        }

        .player-input {
            font-size: 16px;
        }

        .player-status {
            min-height: 25px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 800;
        }

        .checking {
            color: #a5a5b3;
        }

        .premium {
            color: #7cffb2;
        }

        .cracked {
            color: #ffbd6b;
        }

        .error {
            color: #ff6262;
        }

        .player-preview {
            display: none;
            align-items: center;
            gap: 14px;

            margin-top: 18px;
            padding: 14px;

            background: #0b0b10;
            border: 1px solid #292932;
            border-radius: 14px;
        }

        .player-preview.show {
            display: flex;
        }

        .skin {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            image-rendering: pixelated;
            object-fit: cover;
            background: #15151c;
        }

        .preview-name {
            font-size: 15px;
            font-weight: 900;
        }

        .preview-type {
            margin-top: 4px;
            font-size: 12px;
            color: #8d8d9a;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 25px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-top: 25px;
        }

        .field label {
            display: block;
            margin-bottom: 10px;

            color: #a7a7b5;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .save-btn {
            width: 100%;
            height: 58px;

            margin-top: 34px;

            border: 0;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #865cff,
                    #6036dc
                );

            color: white;
            font-size: 14px;
            font-weight: 950;

            cursor: pointer;

            box-shadow:
                0 15px 35px rgba(105, 64, 255, 0.22);

            transition: 0.15s ease;
        }

        .save-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .save-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            min-height: 22px;
            margin-top: 15px;

            text-align: center;
            font-size: 13px;
            font-weight: 900;
        }

        .success {
            color: #72ffad;
        }

        .message-error {
            color: #ff6464;
        }

        .security {
            margin-top: 20px;
            padding: 13px 15px;

            border: 1px solid #272731;
            border-radius: 12px;

            color: #777784;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .page {
                width: min(100% - 24px, 1010px);
                padding-top: 20px;
            }

            .panel {
                padding: 20px;
                border-radius: 18px;
            }

            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }

            h1 {
                letter-spacing: -3px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">
        RO TIERLIST
    </div>

    <h1>
        Admin Panel
    </h1>

    <div class="subtitle">
        Manage players, tiers and PvP statistics.
    </div>

    <div class="panel">

        <!-- PLAYER -->

        <div class="field">

            <label>
                Minecraft Player
            </label>

            <input
                id="minecraftName"
                class="player-input"
                type="text"
                autocomplete="off"
                placeholder="Enter any Minecraft username..."
            >

            <div
                id="playerStatus"
                class="player-status"
            >
                You can enter any name.
            </div>

        </div>


        <!-- PREVIEW -->

        <div
            id="playerPreview"
            class="player-preview"
        >

            <img
                id="skin"
                class="skin"
                src=""
                alt=""
            >

            <div>

                <div
                    id="previewName"
                    class="preview-name"
                >
                    -
                </div>

                <div
                    id="previewType"
                    class="preview-type"
                >
                    Checking...
                </div>

            </div>

        </div>


        <!-- GAME + TIER -->

        <div class="grid-2">

            <div class="field">

                <label>
                    Gamemode
                </label>

                <select id="gamemode">

                    <option value="vanilla">
                        Vanilla
                    </option>

                    <option value="sword">
                        Sword
                    </option>

                    <option value="axe">
                        Axe
                    </option>

                    <option value="uhc">
                        UHC
                    </option>

                    <option value="pot">
                        Pot
                    </option>

                    <option value="mace">
                        Mace
                    </option>

                    <option value="smp">
                        SMP
                    </option>

                    <option value="crystal">
                        Crystal
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Tier
                </label>

                <select id="tier">

                    <option value="Unranked">
                        Unranked
                    </option>

                    <option value="LT5">
                        LT5
                    </option>

                    <option value="HT5">
                        HT5
                    </option>

                    <option value="LT4">
                        LT4
                    </option>

                    <option value="HT4">
                        HT4
                    </option>

                    <option value="LT3">
                        LT3
                    </option>

                    <option value="HT3">
                        HT3
                    </option>

                    <option value="LT2">
                        LT2
                    </option>

                    <option value="HT2">
                        HT2
                    </option>

                    <option value="LT1">
                        LT1
                    </option>

                    <option value="HT1">
                        HT1
                    </option>

                </select>

            </div>

        </div>


        <!-- STATS -->

        <div class="grid-3">

            <div class="field">

                <label>
                    Tests
                </label>

                <input
                    id="tests"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="field">

                <label>
                    Wins
                </label>

                <input
                    id="wins"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="field">

                <label>
                    Losses
                </label>

                <input
                    id="losses"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>

        </div>


        <!-- SAVE -->

        <button
            id="saveButton"
            class="save-btn"
            type="button"
        >
            Save Player
        </button>

        <div
            id="message"
            class="message"
        ></div>


        <div class="security">
            Admin access is restricted to the RO TierList owner account.
        </div>

    </div>

</div>


<script type="module">

import { auth, app } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    push,
    update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================
   CONFIG
========================================= */

const OWNER_EMAIL = "denizzzezw@gmail.com";

const WORKER_URL =
    "https://rotierlist-minecraft.denizzzezw.workers.dev";


const database = getDatabase(app);


/* =========================================
   ELEMENTS
========================================= */

const minecraftName =
    document.getElementById("minecraftName");

const gamemode =
    document.getElementById("gamemode");

const tier =
    document.getElementById("tier");

const tests =
    document.getElementById("tests");

const wins =
    document.getElementById("wins");

const losses =
    document.getElementById("losses");

const saveButton =
    document.getElementById("saveButton");

const message =
    document.getElementById("message");

const playerStatus =
    document.getElementById("playerStatus");

const playerPreview =
    document.getElementById("playerPreview");

const skin =
    document.getElementById("skin");

const previewName =
    document.getElementById("previewName");

const previewType =
    document.getElementById("previewType");


/* =========================================
   STATE
========================================= */

let currentUser = null;

let detectedAccountType = "cracked";

let detectedUUID = "";

let existingPlayerUID = null;

let checkingPlayer = false;


/* =========================================
   HELPERS
========================================= */

function cleanName(value) {

    return String(value || "").trim();

}


function normalize(value) {

    return String(value || "")
        .trim()
        .toLowerCase();

}


function setMessage(text, type = "") {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;

        if (!user) {

            window.location.href =
                "./login.html";

            return;
        }


        const email =
            String(user.email || "").toLowerCase();


        if (
            email !==
            OWNER_EMAIL.toLowerCase()
        ) {

            document.body.innerHTML = `
                <div style="
                    min-height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#050509;
                    color:white;
                    font-family:Arial,sans-serif;
                    text-align:center;
                    padding:30px;
                ">
                    <div>
                        <h1>Access Denied</h1>

                        <p style="color:#888;">
                            You are not allowed to access
                            the Admin Panel.
                        </p>

                        <a
                            href="./index.html"
                            style="
                                color:#8b5cff;
                                text-decoration:none;
                                font-weight:bold;
                            "
                        >
                            Back to Home
                        </a>
                    </div>
                </div>
            `;

            return;
        }

    }
);


/* =========================================
   CHECK PLAYER
========================================= */

let checkTimeout = null;

minecraftName.addEventListener(
    "input",
    () => {

        clearTimeout(checkTimeout);

        const name =
            cleanName(minecraftName.value);


        existingPlayerUID = null;

        detectedUUID = "";

        detectedAccountType =
            "cracked";


        if (!name) {

            playerStatus.textContent =
                "You can enter any name.";

            playerStatus.className =
                "player-status";

            playerPreview.classList.remove(
                "show"
            );

            return;
        }


        playerStatus.textContent =
            "Checking Minecraft account...";

        playerStatus.className =
            "player-status checking";

        playerPreview.classList.add(
            "show"
        );

        previewName.textContent =
            name;

        previewType.textContent =
            "Checking...";


        /*
         * Small delay so we don't spam
         * the Worker on every keypress.
         */

        checkTimeout = setTimeout(
            () => checkPlayer(name),
            350
        );

    }
);


/* =========================================
   PLAYER CHECK FUNCTION
========================================= */

async function checkPlayer(name) {

    checkingPlayer = true;


    /*
     * FIRST:
     * Search Firebase for an existing player.
     *
     * This works even if the name is cracked.
     */

    try {

        const snapshot =
            await get(
                ref(database, "players")
            );


        if (snapshot.exists()) {

            const players =
                snapshot.val();


            for (
                const [uid, player]
                of Object.entries(players)
            ) {

                if (
                    normalize(player?.minecraftName)
                    ===
                    normalize(name)
                ) {

                    existingPlayerUID = uid;

                    break;
                }

            }

        }

    } catch (error) {

        console.error(
            "Firebase player lookup error:",
            error
        );

    }


    /*
     * SECOND:
     * Ask the Worker about Minecraft account.
     */

    try {

        const response =
            await fetch(
                WORKER_URL +
                "?username=" +
                encodeURIComponent(name),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Worker returned " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            data?.success === true &&
            data?.accountType === "premium"
        ) {

            detectedAccountType =
                "premium";

            detectedUUID =
                data.uuid || "";


            playerStatus.textContent =
                "✓ Premium Minecraft account verified";

            playerStatus.className =
                "player-status premium";


            previewType.textContent =
                "Premium • " +
                (detectedUUID || "Verified");


            skin.src =
                "https://mc-heads.net/avatar/" +
                encodeURIComponent(name) +
                "/48";

        } else {

            /*
             * Important:
             * We DO NOT block the player.
             *
             * The admin can still save it.
             */

            detectedAccountType =
                "cracked";

            detectedUUID =
                data?.uuid || "";


            playerStatus.textContent =
                "✓ Name accepted • Cracked / Unverified";

            playerStatus.className =
                "player-status cracked";


            previewType.textContent =
                "Cracked / Unverified";


            skin.src =
                "https://mc-heads.net/avatar/" +
                encodeURIComponent(name) +
                "/48";

        }


    } catch (error) {

        console.error(
            "Minecraft account check error:",
            error
        );


        /*
         * Worker unavailable?
         *
         * STILL allow saving.
         */

        detectedAccountType =
            "cracked";


        playerStatus.textContent =
            "✓ Name accepted • Account check unavailable";

        playerStatus.className =
            "player-status cracked";


        previewType.textContent =
            "Cracked / Unverified";


        skin.src =
            "https://mc-heads.net/avatar/" +
            encodeURIComponent(name) +
            "/48";

    }


    checkingPlayer = false;

}


/* =========================================
   SAVE PLAYER
========================================= */

saveButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            setMessage(
                "You are not logged in.",
                "message-error"
            );

            return;
        }


        const email =
            String(
                currentUser.email || ""
            ).toLowerCase();


        if (
            email !==
            OWNER_EMAIL.toLowerCase()
        ) {

            setMessage(
                "Access denied.",
                "message-error"
            );

            return;
        }


        const name =
            cleanName(minecraftName.value);


        /*
         * ONLY requirement:
         * the input cannot be completely empty.
         *
         * No Minecraft username regex.
         * "1" works.
         * "abc" works.
         * "test_player" works.
         * "anything" works.
         */

        if (!name) {

            setMessage(
                "Enter a player name first.",
                "message-error"
            );

            minecraftName.focus();

            return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        try {

            /*
             * If we don't already know the account type,
             * do one final check.
             */

            if (!checkingPlayer) {

                await checkPlayer(name);

            }


            /*
             * Read existing player again.
             *
             * This prevents duplicate entries.
             */

            const playersSnapshot =
                await get(
                    ref(database, "players")
                );


            let playerUID =
                existingPlayerUID;


            if (!playerUID && playersSnapshot.exists()) {

                const players =
                    playersSnapshot.val();


                for (
                    const [uid, player]
                    of Object.entries(players)
                ) {

                    if (
                        normalize(player?.minecraftName)
                        ===
                        normalize(name)
                    ) {

                        playerUID = uid;

                        break;
                    }

                }

            }


            /*
             * CREATE NEW PLAYER
             */

            if (!playerUID) {

                const newPlayerRef =
                    push(
                        ref(database, "players")
                    );


                playerUID =
                    newPlayerRef.key;

            }


            /*
             * Existing data.
             *
             * We only change the selected gamemode.
             * Other gamemodes stay untouched.
             */

            let oldPlayer = {};

            if (playersSnapshot.exists()) {

                oldPlayer =
                    playersSnapshot
                        .val()?.[playerUID]
                    || {};

            }


            const oldTiers =
                oldPlayer.tiers || {};

            const oldStats =
                oldPlayer.stats || {};


            const mode =
                gamemode.value;


            const newTiers = {
                ...oldTiers,
                [mode]: tier.value
            };


            const newStats = {
                ...oldStats,

                [mode]: {
                    tests:
                        Number(tests.value) || 0,

                    wins:
                        Number(wins.value) || 0,

                    losses:
                        Number(losses.value) || 0
                }
            };


            /*
             * SAVE
             */

            await update(
                ref(
                    database,
                    "players/" + playerUID
                ),
                {

                    minecraftName:
                        name,

                    uuid:
                        detectedUUID ||
                        oldPlayer.uuid ||
                        "",

                    accountType:
                        detectedAccountType,

                    tiers:
                        newTiers,

                    stats:
                        newStats,

                    updatedAt:
                        Date.now()

                }
            );


            existingPlayerUID =
                playerUID;


            setMessage(
                "✓ Player saved successfully.",
                "success"
            );


            saveButton.textContent =
                "Saved ✓";


            setTimeout(
                () => {

                    saveButton.textContent =
                        "Save Player";

                },
                1800
            );


        } catch (error) {

            console.error(
                "Save error:",
                error
            );


            setMessage(
                "Error saving player: " +
                (
                    error?.message ||
                    "Unknown error"
                ),
                "message-error"
            );


            saveButton.textContent =
                "Save Player";


        } finally {

            saveButton.disabled = false;

        }

    }
);

</script>

</body>
</html>
