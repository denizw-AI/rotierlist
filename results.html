<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RO TierList | Results</title>

    <style>
        :root {
            --bg: #07070b;
            --panel: #0d0d13;
            --panel2: #101017;
            --border: #252532;
            --purple: #815cff;
            --purple2: #9b7cff;
            --text: #f5f5f7;
            --muted: #858597;
            --green: #4ade80;
            --yellow: #f5c542;
            --red: #ff6565;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(129, 92, 255, .13),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(1240px, 94%);
            margin: auto;
            padding: 55px 0 90px;
        }

        /* HEADER */

        .hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .eyebrow {
            color: var(--purple2);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(48px, 7vw, 72px);
            line-height: .95;
            letter-spacing: -4px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .hero p {
            color: var(--muted);
            font-size: 16px;
        }

        /* CONTROLS */

        .controls {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .tabs {
            height: 56px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 5px;
            background: #0d0d13;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .tab {
            border: 0;
            background: transparent;
            color: #858597;
            border-radius: 9px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: .2s;
        }

        .tab:hover {
            color: white;
        }

        .tab.active {
            background: linear-gradient(
                135deg,
                var(--purple),
                #7250f3
            );
            color: white;
            box-shadow:
                0 6px 20px rgba(129, 92, 255, .22);
        }

        .search {
            height: 56px;
            background: #0d0d13;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            padding: 0 18px;
            outline: none;
            font-size: 14px;
            width: 100%;
        }

        .search::placeholder {
            color: #666678;
        }

        .search:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(129, 92, 255, .08);
        }

        /* TABLE */

        .results-box {
            border: 1px solid var(--border);
            background: rgba(13, 13, 19, .86);
            border-radius: 18px;
            overflow: hidden;
        }

        .table-head {
            display: grid;
            grid-template-columns:
                minmax(300px, 1fr)
                150px
                150px
                130px;
            min-height: 64px;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid var(--border);
            color: #727287;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .result-row {
            display: grid;
            grid-template-columns:
                minmax(300px, 1fr)
                150px
                150px
                130px;
            min-height: 88px;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid #1b1b24;
            transition: .18s;
        }

        .result-row:last-child {
            border-bottom: 0;
        }

        .result-row:hover {
            background: rgba(129, 92, 255, .035);
        }

        /* PLAYER */

        .player {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .skin {
            width: 42px;
            height: 42px;
            border-radius: 9px;
            object-fit: cover;
            image-rendering: pixelated;
            background: #15151d;
            border: 1px solid #292934;
        }

        .player-info {
            min-width: 0;
        }

        .player-name {
            color: white;
            font-size: 14px;
            font-weight: 900;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account {
            margin-top: 4px;
            color: #737386;
            font-size: 11px;
        }

        .account.premium {
            color: #9279ff;
        }

        .account.cracked {
            color: #e8a65c;
        }

        /* COLUMNS */

        .gamemode {
            color: #a6a6b8;
            font-size: 12px;
            font-weight: 800;
        }

        .date {
            color: #6f6f80;
            font-size: 12px;
        }

        /* STATUS */

        .status {
            justify-self: start;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 900;
        }

        .status.ranked {
            color: #83edaa;
            background: rgba(74, 222, 128, .08);
            border: 1px solid rgba(74, 222, 128, .16);
        }

        .status.pending {
            color: #f5c542;
            background: rgba(245, 197, 66, .08);
            border: 1px solid rgba(245, 197, 66, .15);
        }

        .status.not-tested {
            color: #858597;
            background: rgba(133, 133, 151, .07);
            border: 1px solid rgba(133, 133, 151, .12);
        }

        /* EMPTY */

        .empty {
            padding: 85px 25px;
            text-align: center;
        }

        .empty-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(129, 92, 255, .08);
            border: 1px solid rgba(129, 92, 255, .15);
            color: var(--purple2);
            font-size: 23px;
        }

        .empty h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty p {
            color: var(--muted);
            font-size: 13px;
        }

        /* LOADING */

        .loading {
            padding: 70px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: var(--purple);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: .3;
            }

            50% {
                opacity: 1;
            }
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .page {
                width: 94%;
                padding-top: 38px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .table-head {
                display: none;
            }

            .result-row {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 18px;
            }

            .player {
                grid-column: 1 / -1;
            }

            .gamemode::before {
                content: "GAMEMODE";
                display: block;
                color: #555565;
                font-size: 9px;
                letter-spacing: 1px;
                margin-bottom: 5px;
            }

            .date::before {
                content: "DATE";
                display: block;
                color: #555565;
                font-size: 9px;
                letter-spacing: 1px;
                margin-bottom: 5px;
            }

            .status {
                justify-self: end;
                align-self: end;
            }

            h1 {
                letter-spacing: -3px;
            }
        }

        @media (max-width: 500px) {

            .tabs {
                height: 52px;
            }

            .tab {
                font-size: 12px;
            }

            .search {
                height: 52px;
            }

            .result-row {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <section class="hero">

        <div class="eyebrow">
            RO / EU MINECRAFT PVP
        </div>

        <h1>Results</h1>

        <p>
            Ultimele rezultate ale testelor PvP.
        </p>

    </section>


    <section class="controls">

        <div class="tabs">

            <button
                class="tab active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="tab"
                data-filter="premium"
            >
                Premium
            </button>

            <button
                class="tab"
                data-filter="cracked"
            >
                Cracked
            </button>

        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search player..."
            autocomplete="off"
        >

    </section>


    <section class="results-box">

        <div class="table-head">

            <div>Player</div>
            <div>Gamemode</div>
            <div>Date</div>
            <div>Status</div>

        </div>

        <div id="results">

            <div class="loading">
                <span class="dot"></span>
                Loading results...
            </div>

        </div>

    </section>

</div>


<script type="module">

    import { app } from "./firebase.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /* =========================
       FIREBASE
    ========================= */

    const database = getDatabase(app);


    /* =========================
       ELEMENTS
    ========================= */

    const resultsContainer =
        document.getElementById("results");

    const searchInput =
        document.getElementById("search");

    const tabs =
        document.querySelectorAll(".tab");


    /* =========================
       STATE
    ========================= */

    let players = {};

    let realResults = {};

    let currentFilter = "all";

    let currentSearch = "";


    /* =========================
       HELPERS
    ========================= */

    function normalize(value) {

        return String(value || "")
            .trim()
            .toLowerCase();

    }


    function escapeHtml(value) {

        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function getName(player, uid) {

        return (
            player?.minecraftName ||
            player?.username ||
            player?.name ||
            uid
        );

    }


    function getType(player) {

        return normalize(
            player?.accountType
        );

    }


    function getUUID(player) {

        return String(
            player?.uuid || ""
        ).replaceAll("-", "");

    }


    function getSkin(player) {

        const uuid =
            getUUID(player);

        if (!uuid) {
            return "";
        }

        return `https://mc-heads.net/avatar/${uuid}/64`;

    }


    function formatDate(value) {

        if (!value) {
            return "Not tested";
        }


        const date =
            new Date(value);


        if (Number.isNaN(date.getTime())) {
            return "Not tested";
        }


        return date.toLocaleDateString(
            "en-GB",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    function getBestTier(player) {

        const modes = [
            "vanilla",
            "sword",
            "axe",
            "uhc",
            "pot",
            "mace",
            "smp",
            "crystal"
        ];


        const score = {
            "HT1": 100,
            "LT1": 90,
            "HT2": 80,
            "LT2": 70,
            "HT3": 60,
            "LT3": 50,
            "HT4": 40,
            "LT4": 30,
            "HT5": 20,
            "LT5": 10,
            "Unranked": 0
        };


        let best = {
            tier: "Unranked",
            mode: null,
            score: 0
        };


        const tiers =
            player?.tiers || {};


        for (const mode of modes) {

            const key =
                Object.keys(tiers).find(
                    key =>
                        normalize(key) === mode
                );


            if (!key) {
                continue;
            }


            const tier =
                tiers[key] || "Unranked";


            const tierScore =
                score[tier] || 0;


            if (tierScore > best.score) {

                best = {
                    tier,
                    mode,
                    score: tierScore
                };

            }

        }


        return best;

    }


    function getGamemode(player) {

        const best =
            getBestTier(player);


        if (!best.mode) {
            return "Not tested";
        }


        return (
            best.mode.charAt(0).toUpperCase() +
            best.mode.slice(1)
        );

    }


    /* =========================
       BUILD FALLBACK RESULTS
       FROM REAL PLAYERS
    ========================= */

    function buildPlayerResults() {

        const list = [];


        Object.entries(players)
            .forEach(([uid, player]) => {

                if (!player) {
                    return;
                }


                const name =
                    getName(player, uid);


                const type =
                    getType(player);


                const best =
                    getBestTier(player);


                const isRanked =
                    best.tier !== "Unranked";


                list.push({

                    id: uid,

                    playerUID: uid,

                    minecraftName: name,

                    accountType: type,

                    uuid: player.uuid || "",

                    gamemode:
                        isRanked
                            ? getGamemode(player)
                            : "Not tested",

                    date:
                        player.updatedAt ||
                        player.createdAt ||
                        null,

                    status:
                        isRanked
                            ? "ranked"
                            : "not-tested",

                    tier: best.tier

                });

            });


        return list;

    }


    /* =========================
       USE REAL RESULTS
       IF RESULTS NODE EXISTS
    ========================= */

    function buildResults() {

        const databaseResults =
            Object.entries(realResults);


        /*
         * If /results exists and has data,
         * use the real test results.
         */

        if (databaseResults.length > 0) {

            return databaseResults
                .map(([id, result]) => {

                    const playerUID =
                        result?.playerUID ||
                        result?.uid ||
                        result?.playerId;


                    const player =
                        playerUID
                            ? players[playerUID]
                            : null;


                    const merged = {

                        ...result,

                        id,

                        playerUID,

                        minecraftName:
                            result?.minecraftName ||
                            result?.username ||
                            player?.minecraftName ||
                            player?.username ||
                            "Unknown",

                        accountType:
                            normalize(
                                result?.accountType ||
                                player?.accountType ||
                                "unknown"
                            ),

                        uuid:
                            result?.uuid ||
                            player?.uuid ||
                            "",

                        gamemode:
                            result?.gamemode ||
                            "Unknown",

                        date:
                            result?.date ||
                            result?.createdAt ||
                            null,

                        status:
                            normalize(
                                result?.status ||
                                "pending"
                            )

                    };


                    return merged;

                });

        }


        /*
         * No /results data yet.
         * Show real registered players instead
         * of fake Alex/Steve demo players.
         */

        return buildPlayerResults();

    }


    /* =========================
       FILTER
    ========================= */

    function filterResults(list) {

        return list.filter(result => {

            const type =
                normalize(
                    result.accountType
                );


            if (
                currentFilter !== "all" &&
                type !== currentFilter
            ) {

                return false;

            }


            const name =
                normalize(
                    result.minecraftName
                );


            if (
                currentSearch &&
                !name.includes(currentSearch)
            ) {

                return false;

            }


            return true;

        });

    }


    /* =========================
       STATUS
    ========================= */

    function getStatus(result) {

        const status =
            normalize(result.status);


        if (
            status === "ranked" ||
            status === "completed" ||
            status === "passed" ||
            status === "complete"
        ) {

            return {
                text: "Ranked",
                className: "ranked"
            };

        }


        if (
            status === "pending" ||
            status === "waiting"
        ) {

            return {
                text: "Pending",
                className: "pending"
            };

        }


        return {
            text: "Not tested",
            className: "not-tested"
        };

    }


    /* =========================
       RENDER
    ========================= */

    function render() {

        const all =
            buildResults();


        const filtered =
            filterResults(all);


        resultsContainer.innerHTML = "";


        if (filtered.length === 0) {

            resultsContainer.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⌁
                    </div>

                    <h2>No results found</h2>

                    <p>
                        There are no test results matching your search.
                    </p>

                </div>
            `;

            return;

        }


        filtered.forEach(result => {

            const row =
                document.createElement("div");


            row.className =
                "result-row";


            const name =
                result.minecraftName ||
                "Unknown";


            const type =
                normalize(
                    result.accountType
                );


            const typeText =
                type === "premium"
                    ? "Premium account"
                    : type === "cracked"
                        ? "Cracked account"
                        : "Account type unknown";


            const skin =
                getSkin(result);


            const status =
                getStatus(result);


            const gamemode =
                result.gamemode ||
                "Not tested";


            const date =
                formatDate(
                    result.date
                );


            row.innerHTML = `

                <div class="player">

                    ${
                        skin
                            ? `
                                <img
                                    class="skin"
                                    src="${escapeHtml(skin)}"
                                    alt=""
                                >
                            `
                            : `
                                <div
                                    class="skin"
                                    style="display:grid;place-items:center;"
                                >
                                    ⛏
                                </div>
                            `
                    }

                    <div class="player-info">

                        <div class="player-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="account ${escapeHtml(type)}">
                            ${escapeHtml(typeText)}
                        </div>

                    </div>

                </div>


                <div class="gamemode">
                    ${escapeHtml(gamemode)}
                </div>


                <div class="date">
                    ${escapeHtml(date)}
                </div>


                <div class="status ${status.className}">
                    ${status.text}
                </div>

            `;


            resultsContainer.appendChild(row);

        });

    }


    /* =========================
       TABS
    ========================= */

    tabs.forEach(tab => {

        tab.addEventListener(
            "click",
            () => {

                tabs.forEach(
                    item =>
                        item.classList.remove("active")
                );


                tab.classList.add("active");


                currentFilter =
                    tab.dataset.filter;


                render();

            }
        );

    });


    /* =========================
       SEARCH
    ========================= */

    searchInput.addEventListener(
        "input",
        () => {

            currentSearch =
                normalize(
                    searchInput.value
                );


            render();

        }
    );


    /* =========================
       PLAYERS
    ========================= */

    onValue(
        ref(database, "players"),
        snapshot => {

            players =
                snapshot.val() || {};

            render();

        },
        error => {

            console.error(
                "Players error:",
                error
            );

            players = {};

            render();

        }
    );


    /* =========================
       REAL RESULTS
    ========================= */

    onValue(
        ref(database, "results"),
        snapshot => {

            realResults =
                snapshot.val() || {};

            render();

        },
        error => {

            /*
             * If /results doesn't exist or cannot
             * be read, the page still works from
             * the players collection.
             */

            console.warn(
                "Results collection unavailable:",
                error
            );

            realResults = {};

            render();

        }
    );

</script>

</body>
</html>
