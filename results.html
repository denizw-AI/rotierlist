<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RO TierList | Results</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07080c;
      --card: #0d1017;
      --card2: #11141c;
      --border: rgba(255,255,255,.07);
      --text: #f4f5f7;
      --muted: #858a98;
      --accent: #7c5cff;
      --accent2: #a78bfa;
      --green: #55d98b;
      --red: #ef6675;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, rgba(124,92,255,.14), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid var(--border);
      background: rgba(7,8,12,.82);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
    }

    .logo span {
      color: var(--accent2);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .nav-links a {
      color: #9ca1ae;
      font-size: 14px;
      font-weight: 700;
      transition: .2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: white;
    }

    .login-btn {
      padding: 10px 17px;
      border-radius: 9px;
      background: white;
      color: #090a0e !important;
    }

    .container {
      width: min(1150px, 92%);
      margin: auto;
    }

    .page-header {
      text-align: center;
      padding: 75px 0 40px;
    }

    .small {
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    h1 {
      font-size: clamp(40px, 6vw, 64px);
      letter-spacing: -3px;
      line-height: 1;
    }

    .page-header p {
      color: var(--muted);
      margin-top: 16px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--border);
      background: #0d1016;
      border-radius: 11px;
    }

    .tabs button {
      border: 0;
      background: transparent;
      color: #777d8b;
      padding: 10px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
    }

    .tabs button.active {
      color: white;
      background: linear-gradient(135deg,#7455f5,#9276ff);
    }

    .search {
      flex: 1;
      min-width: 220px;
      background: #0d1017;
      border: 1px solid var(--border);
      color: white;
      border-radius: 10px;
      outline: none;
      padding: 12px 14px;
      font-size: 12px;
    }

    .search:focus {
      border-color: rgba(124,92,255,.5);
    }

    .result-list {
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      background: var(--card);
      margin-bottom: 60px;
    }

    .result-head {
      display: grid;
      grid-template-columns: 1fr 130px 130px 120px;
      padding: 14px 20px;
      background: #0b0e14;
      color: #636977;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 130px 130px 120px;
      align-items: center;
      padding: 13px 20px;
      min-height: 75px;
      border-top: 1px solid var(--border);
      transition: .2s;
    }

    .result:hover {
      background: rgba(255,255,255,.025);
    }

    .player {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .skin {
      width: 43px;
      height: 52px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .player-name {
      font-size: 14px;
      font-weight: 900;
    }

    .player-sub {
      color: #606674;
      font-size: 10px;
      margin-top: 3px;
    }

    .mode {
      color: #9298a5;
      font-size: 11px;
      font-weight: 800;
    }

    .date {
      color: #666c79;
      font-size: 10px;
    }

    .status {
      width: fit-content;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 900;
    }

    .passed {
      color: var(--green);
      background: rgba(85,217,139,.08);
    }

    .failed {
      color: var(--red);
      background: rgba(239,102,117,.08);
    }

    .pending {
      color: #e3b94f;
      background: rgba(227,185,79,.08);
    }

    .empty {
      padding: 70px 20px;
      text-align: center;
    }

    .empty h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty p {
      color: var(--muted);
      font-size: 12px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 35px 6%;
      color: #565c69;
      font-size: 11px;
      text-align: center;
    }

    @media(max-width:800px) {

      nav {
        padding: 0 4%;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a:nth-child(2),
      .nav-links a:nth-child(3),
      .nav-links a:nth-child(4),
      .nav-links a:nth-child(5) {
        display: none;
      }

      .result-head {
        display: none;
      }

      .result {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 15px;
      }

      .mode,
      .date,
      .status {
        margin-left: 56px;
      }

      .controls {
        flex-direction: column;
      }

      .tabs {
        width: 100%;
      }

      .tabs button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo">
      RO<span>TierList</span>
    </a>

    <div class="nav-links">

      <a href="index.html">Home</a>
      <a href="players.html">Players</a>
      <a href="leaderboards.html">Leaderboards</a>
      <a href="results.html" class="active">Results</a>
      <a href="tiers.html">Tiers</a>

      <a
        href="https://discord.gg/bms3jPBD9p"
        target="_blank"
      >
        Discord
      </a>

      <a href="login.html" class="login-btn">
        Login
      </a>

    </div>

  </nav>


  <main class="container">

    <section class="page-header">

      <div class="small">
        RO / EU Minecraft PvP
      </div>

      <h1>
        Results
      </h1>

      <p>
        Ultimele rezultate ale testelor PvP.
      </p>

    </section>


    <div class="controls">

      <div class="tabs">

        <button
          id="allBtn"
          class="active"
        >
          All
        </button>

        <button id="premiumBtn">
          Premium
        </button>

        <button id="crackedBtn">
          Cracked
        </button>

      </div>


      <input
        id="search"
        class="search"
        placeholder="Search player..."
        type="text"
      >

    </div>


    <div class="result-list">

      <div class="result-head">

        <div>Player</div>
        <div>Gamemode</div>
        <div>Date</div>
        <div>Status</div>

      </div>


      <div id="results"></div>

    </div>

  </main>


  <footer>
    © 2026 RO TierList · Minecraft PvP Tier Rankings
  </footer>


  <script>

    /*
      DEMO RESULTS

      Acestea sunt doar exemple.
      Mai tarziu le conectam la Firebase.
    */

    const data = [

      {
        name: "Alex",
        type: "Premium",
        mode: "Vanilla",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Steve",
        type: "Premium",
        mode: "Sword",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Alex",
        type: "Cracked",
        mode: "Axe",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Steve",
        type: "Cracked",
        mode: "Pot",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Alex",
        type: "Premium",
        mode: "UHC",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Steve",
        type: "Premium",
        mode: "Mace",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Alex",
        type: "Cracked",
        mode: "SMP",
        date: "Not tested",
        status: "Pending"
      },

      {
        name: "Steve",
        type: "Premium",
        mode: "Crystal",
        date: "Not tested",
        status: "Pending"
      }

    ];


    const results = document.getElementById("results");

    const search = document.getElementById("search");

    const allBtn = document.getElementById("allBtn");
    const premiumBtn = document.getElementById("premiumBtn");
    const crackedBtn = document.getElementById("crackedBtn");


    let currentFilter = "All";


    function render() {

      const query =
        search.value
          .trim()
          .toLowerCase();


      const filtered = data.filter(item => {

        const matchesType =
          currentFilter === "All" ||
          item.type === currentFilter;

        const matchesSearch =
          item.name
            .toLowerCase()
            .includes(query);

        return matchesType && matchesSearch;

      });


      results.innerHTML = "";


      if (!filtered.length) {

        results.innerHTML = `

          <div class="empty">

            <h2>
              No results found
            </h2>

            <p>
              Nu exista rezultate pentru cautarea ta.
            </p>

          </div>

        `;

        return;

      }


      filtered.forEach(item => {

        const row =
          document.createElement("div");

        row.className = "result";


        const skin =
          item.name === "Alex"
            ? "https://mc-heads.net/body/Alex/70"
            : "https://mc-heads.net/body/Steve/70";


        let statusClass = "pending";


        if (item.status === "Passed") {
          statusClass = "passed";
        }

        if (item.status === "Failed") {
          statusClass = "failed";
        }


        row.innerHTML = `

          <div class="player">

            <img
              class="skin"
              src="${skin}"
              alt="${item.name}"
            >

            <div>

              <div class="player-name">
                ${item.name}
              </div>

              <div class="player-sub">
                ${item.type} account
              </div>

            </div>

          </div>


          <div class="mode">
            ${item.mode}
          </div>


          <div class="date">
            ${item.date}
          </div>


          <div>
            <span class="status ${statusClass}">
              ${item.status}
            </span>
          </div>

        `;


        row.addEventListener("click", () => {

          window.location.href =
            "players.html?player=" +
            encodeURIComponent(item.name);

        });


        results.appendChild(row);

      });

    }


    function setFilter(filter) {

      currentFilter = filter;

      allBtn.classList.remove("active");
      premiumBtn.classList.remove("active");
      crackedBtn.classList.remove("active");


      if (filter === "All") {
        allBtn.classList.add("active");
      }

      if (filter === "Premium") {
        premiumBtn.classList.add("active");
      }

      if (filter === "Cracked") {
        crackedBtn.classList.add("active");
      }


      render();

    }


    allBtn.addEventListener(
      "click",
      () => setFilter("All")
    );


    premiumBtn.addEventListener(
      "click",
      () => setFilter("Premium")
    );


    crackedBtn.addEventListener(
      "click",
      () => setFilter("Cracked")
    );


    search.addEventListener(
      "input",
      render
    );


    render();

  </script>
<script type="module" src="./auth-ui.js"></script>
</body>
</html>
