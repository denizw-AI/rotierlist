<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | RO TierList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(124,92,255,0.16),
                    transparent 35%
                ),
                #08080d;

            color: white;

            padding: 120px 20px 60px;

        }


        .container {

            width: 100%;
            max-width: 1100px;

            margin: auto;

        }


        .loading {

            text-align: center;

            color: #858592;

            padding: 100px 20px;

        }


        .profile-header {

            display: grid;

            grid-template-columns:
                180px 1fr;

            gap: 30px;

            padding: 30px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);

            margin-bottom: 25px;

        }


        .skin-container {

            height: 220px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            overflow: hidden;

        }


        .skin {

            max-height: 220px;

            max-width: 150px;

            image-rendering: pixelated;

        }


        .profile-info {

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        .minecraft-name {

            font-size: 34px;

            font-weight: 900;

            margin-bottom: 12px;

        }


        .badges {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 20px;

        }


        .badge {

            padding: 7px 11px;

            border-radius: 8px;

            background: #171720;

            border:
                1px solid rgba(255,255,255,0.07);

            color: #bcbcca;

            font-size: 12px;

            font-weight: 800;

        }


        .badge.premium {

            color: #65e6a0;

            background:
                rgba(50,220,130,0.08);

            border-color:
                rgba(50,220,130,0.16);

        }


        .badge.unknown {

            color: #ffc85a;

            background:
                rgba(255,190,60,0.08);

            border-color:
                rgba(255,190,60,0.16);

        }


        .uuid {

            color: #626270;

            font-size: 11px;

            word-break: break-all;

        }


        .section-title {

            font-size: 20px;

            font-weight: 900;

            margin: 30px 0 15px;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

        }


        .stat {

            padding: 20px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 16px;

        }


        .stat-label {

            color: #747481;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .stat-value {

            font-size: 25px;

            font-weight: 900;

        }


        .gamemodes {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

        }


        .gamemode {

            padding: 20px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 16px;

        }


        .gamemode-name {

            color: #92929f;

            font-size: 12px;

            margin-bottom: 12px;

        }


        .tier {

            font-size: 24px;

            font-weight: 900;

            color: #777783;

        }


        .tier.ranked {

            color: white;

        }


        .server {

            margin-top: 8px;

            color: #5f5f6c;

            font-size: 11px;

        }


        .history {

            padding: 25px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 16px;

            color: #777783;

        }


        .empty {

            text-align: center;

            padding: 30px;

        }


        @media (max-width: 800px) {

            .profile-header {

                grid-template-columns: 1fr;

                text-align: center;

            }

            .badges {

                justify-content: center;

            }

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .gamemodes {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 500px) {

            body {

                padding-left: 12px;
                padding-right: 12px;

            }

            .stats,
            .gamemodes {

                grid-template-columns: 1fr;

            }

            .minecraft-name {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div
        id="loading"
        class="loading"
    >

        Loading profile...

    </div>


    <div
        id="profile"
        style="display:none;"
    >


        <div class="profile-header">


            <div class="skin-container">

                <img
                    id="skin"
                    class="skin"
                    src=""
                    alt="Minecraft Skin"
                >

            </div>


            <div class="profile-info">

                <div
                    id="minecraftName"
                    class="minecraft-name"
                >
                    -
                </div>


                <div
                    id="badges"
                    class="badges"
                ></div>


                <div
                    id="uuid"
                    class="uuid"
                ></div>

            </div>

        </div>


        <div class="section-title">
            Statistics
        </div>


        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    Overall Tier
                </div>

                <div
                    id="overallTier"
                    class="stat-value"
                >
                    Unranked
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Gamemodes
                </div>

                <div
                    id="rankedModes"
                    class="stat-value"
                >
                    0/8
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Tests
                </div>

                <div
                    id="tests"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Region
                </div>

                <div
                    id="region"
                    class="stat-value"
                >
                    EU
                </div>

            </div>


        </div>


        <div class="section-title">
            Gamemode Tiers
        </div>


        <div
            id="gamemodes"
            class="gamemodes"
        ></div>


        <div class="section-title">
            Test History
        </div>


        <div
            class="history"
            id="history"
        >

            <div class="empty">
                No tests completed yet.
            </div>

        </div>


    </div>

</div>


<script type="module">

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
    auth,
    app
} from "./firebase.js";


const database =
    getDatabase(app);


const loading =
    document.getElementById("loading");

const profile =
    document.getElementById("profile");

const minecraftName =
    document.getElementById("minecraftName");

const skin =
    document.getElementById("skin");

const badges =
    document.getElementById("badges");

const uuid =
    document.getElementById("uuid");

const overallTier =
    document.getElementById("overallTier");

const rankedModes =
    document.getElementById("rankedModes");

const tests =
    document.getElementById("tests");

const region =
    document.getElementById("region");

const gamemodes =
    document.getElementById("gamemodes");


const modeNames = {

    vanilla: "Vanilla",
    sword: "Sword",
    axe: "Axe",
    uhc: "UHC",
    pot: "Pot",
    mace: "Mace",
    smp: "SMP",
    crystal: "Crystal"

};


function getSkinUrl(player) {

    if (player.uuid) {

        return `https://mc-heads.net/body/${player.uuid}/200`;

    }

    return `https://mc-heads.net/body/${encodeURIComponent(player.minecraftName)}/200`;

}


function getOverallTier(tiers) {

    const values =
        Object.values(tiers || {});


    const ranked =
        values.filter(
            tier =>
                tier &&
                tier !== "Unranked"
        );


    if (!ranked.length) {

        return "Unranked";

    }


    return ranked[0];

}


function renderBadges(player) {

    badges.innerHTML = "";


    const accountBadge =
        document.createElement("div");

    accountBadge.className =
        "badge " +
        (
            player.accountType === "premium"
                ? "premium"
                : "unknown"
        );


    accountBadge.textContent =
        player.accountType === "premium"
            ? "✓ Premium"
            : "⚠ Unverified";


    badges.appendChild(
        accountBadge
    );


    const regionBadge =
        document.createElement("div");

    regionBadge.className =
        "badge";


    regionBadge.textContent =
        "🌍 " +
        (player.region || "EU");


    badges.appendChild(
        regionBadge
    );


    const rankedBadge =
        document.createElement("div");

    rankedBadge.className =
        "badge";


    const tierValues =
        Object.values(
            player.tiers || {}
        );


    const isRanked =
        tierValues.some(
            tier =>
                tier &&
                tier !== "Unranked"
        );


    rankedBadge.textContent =
        isRanked
            ? "✓ Ranked"
            : "Unranked";


    badges.appendChild(
        rankedBadge
    );

}


function renderGamemodes(player) {

    gamemodes.innerHTML = "";


    const tiers =
        player.tiers || {};


    let ranked =
        0;


    Object.entries(modeNames)
        .forEach(
            ([key, name]) => {


                const tier =
                    tiers[key] ||
                    "Unranked";


                if (
                    tier !==
                    "Unranked"
                ) {

                    ranked++;

                }


                const card =
                    document.createElement("div");

                card.className =
                    "gamemode";


                card.innerHTML = `

                    <div class="gamemode-name">
                        ${name}
                    </div>

                    <div class="
                        tier
                        ${tier !== "Unranked" ? "ranked" : ""}
                    ">
                        ${tier}
                    </div>

                    <div class="server">
                        ${
                            player.accountType === "premium"
                                ? "MCPVP.CLUB"
                                : "CRAFTIFY.LOL"
                        }
                    </div>

                `;


                gamemodes.appendChild(
                    card
                );

            }
        );


    rankedModes.textContent =
        `${ranked}/8`;

}


async function loadProfile(user) {

    try {

        const snapshot =
            await get(
                ref(
                    database,
                    `players/${user.uid}`
                )
            );


        if (!snapshot.exists()) {

            loading.textContent =
                "Profile data not found.";

            return;

        }


        const player =
            snapshot.val();


        minecraftName.textContent =
            player.minecraftName ||
            user.displayName ||
            "Unknown";


        uuid.textContent =
            player.uuid
                ? "UUID: " + player.uuid
                : "UUID: Not available";


        skin.src =
            getSkinUrl(player);


        skin.onerror =
            () => {

                skin.src =
                    `https://mc-heads.net/body/${encodeURIComponent(
                        player.minecraftName
                    )}/200`;

            };


        region.textContent =
            player.region ||
            "EU";


        tests.textContent =
            player.stats?.tests ||
            0;


        overallTier.textContent =
            getOverallTier(
                player.tiers
            );


        renderBadges(
            player
        );


        renderGamemodes(
            player
        );


        loading.style.display =
            "none";

        profile.style.display =
            "block";


    }

    catch (error) {

        console.error(error);

        loading.textContent =
            "Could not load profile.";

    }

}


onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        loadProfile(user);

    }
);

</script>


<script
    type="module"
    src="./auth-ui.js"
></script>


</body>

</html>
