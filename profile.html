<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | RO TierList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(124,92,255,0.16),
                    transparent 35%
                ),
                #08080d;

            color: white;

            padding: 120px 20px 60px;

        }


        .container {

            width: 100%;
            max-width: 1100px;

            margin: auto;

        }


        .loading {

            text-align: center;

            color: #858592;

            padding: 100px 20px;

        }


        .error {

            text-align: center;

            color: #ff6b6b;

            padding: 100px 20px;

        }


        .profile-header {

            display: grid;

            grid-template-columns:
                180px 1fr;

            gap: 30px;

            padding: 30px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);

            margin-bottom: 25px;

        }


        .skin-container {

            height: 220px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            overflow: hidden;

        }


        .skin {

            max-height: 220px;

            max-width: 150px;

            image-rendering: pixelated;

        }


        .profile-info {

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        .minecraft-name {

            font-size: 34px;

            font-weight: 900;

            margin-bottom: 12px;

        }


        .badges {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 20px;

        }


        .badge {

            padding: 7px 11px;

            border-radius: 8px;

            background: #171720;

            border:
                1px solid rgba(255,255,255,0.07);

            color: #bcbcca;

            font-size: 12px;

            font-weight: 800;

        }


        .badge.premium {

            color: #65e6a0;

            background:
                rgba(50,220,130,0.08);

            border-color:
                rgba(50,220,130,0.16);

        }


        .badge.unknown {

            color: #ffc85a;

            background:
                rgba(255,190,60,0.08);

            border-color:
                rgba(255,190,60,0.16);

        }


        .badge.ranked {

            color: #b99cff;

            background:
                rgba(124,92,255,0.10);

            border-color:
                rgba(124,92,255,0.20);

        }


        .uuid {

            color: #626270;

            font-size: 11px;

            word-break: break-all;

        }


        .section-title {

            font-size: 20px;

            font-weight: 900;

            margin: 30px 0 15px;

        }


        .region-box {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 15px;

        }


        .region-label {

            color: #777783;

            font-size: 12px;

            font-weight: 700;

        }


        .region-select {

            padding: 10px 13px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,0.08);

            background: #111119;

            color: white;

            outline: none;

            cursor: pointer;

            font-weight: 700;

        }


        .region-select:focus {

            border-color: #7c5cff;

        }


        .save-region {

            padding: 10px 14px;

            border: none;

            border-radius: 10px;

            background: #7c5cff;

            color: white;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;

        }


        .save-region:hover {

            transform: translateY(-1px);

            opacity: 0.9;

        }


        .save-region:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        .region-status {

            color: #65e6a0;

            font-size: 11px;

            display: none;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

        }


        .stat {

            padding: 20px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 16px;

        }


        .stat-label {

            color: #747481;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .stat-value {

            font-size: 25px;

            font-weight: 900;

        }


        .gamemodes {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

        }


        .gamemode {

            padding: 20px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 16px;

            transition: 0.2s;

        }


        .gamemode:hover {

            transform: translateY(-2px);

            border-color:
                rgba(124,92,255,0.25);

        }


        .gamemode-name {

            color: #92929f;

            font-size: 12px;

            margin-bottom: 12px;

        }


        .tier {

            font-size: 24px;

            font-weight: 900;

            color: #777783;

        }


        .tier.ranked {

            color: white;

        }


        .server {

            margin-top: 8px;

            color: #5f5f6c;

            font-size: 11px;

        }


        .history {

            padding: 25px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 16px;

            color: #777783;

        }


        .empty {

            text-align: center;

            padding: 30px;

        }


        @media (max-width: 800px) {

            .profile-header {

                grid-template-columns: 1fr;

                text-align: center;

            }

            .badges {

                justify-content: center;

            }

            .region-box {

                justify-content: center;

                flex-wrap: wrap;

            }

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .gamemodes {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 500px) {

            body {

                padding-left: 12px;
                padding-right: 12px;

            }

            .stats,
            .gamemodes {

                grid-template-columns: 1fr;

            }

            .minecraft-name {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div
        id="loading"
        class="loading"
    >

        Loading profile...

    </div>


    <div
        id="error"
        class="error"
        style="display:none;"
    ></div>


    <div
        id="profile"
        style="display:none;"
    >


        <div class="profile-header">


            <div class="skin-container">

                <img
                    id="skin"
                    class="skin"
                    src=""
                    alt="Minecraft Skin"
                >

            </div>


            <div class="profile-info">

                <div
                    id="minecraftName"
                    class="minecraft-name"
                >
                    -
                </div>


                <div
                    id="badges"
                    class="badges"
                ></div>


                <div
                    id="uuid"
                    class="uuid"
                ></div>


                <div class="region-box">

                    <span class="region-label">
                        Region
                    </span>

                    <select
                        id="regionSelect"
                        class="region-select"
                    >

                        <option value="EU">
                            🇪🇺 EU
                        </option>

                        <option value="NA">
                            🇺🇸 NA
                        </option>

                        <option value="AS">
                            🌏 AS
                        </option>

                        <option value="SA">
                            🌎 SA
                        </option>

                        <option value="AU">
                            🇦🇺 AU
                        </option>

                    </select>


                    <button
                        id="saveRegion"
                        class="save-region"
                    >

                        Save

                    </button>


                    <span
                        id="regionStatus"
                        class="region-status"
                    >
                        Saved!
                    </span>

                </div>

            </div>

        </div>


        <div class="section-title">
            Statistics
        </div>


        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    Overall Tier
                </div>

                <div
                    id="overallTier"
                    class="stat-value"
                >
                    Unranked
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Gamemodes
                </div>

                <div
                    id="rankedModes"
                    class="stat-value"
                >
                    0/8
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Tests
                </div>

                <div
                    id="tests"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Region
                </div>

                <div
                    id="region"
                    class="stat-value"
                >
                    EU
                </div>

            </div>


        </div>


        <div class="section-title">
            Gamemode Tiers
        </div>


        <div
            id="gamemodes"
            class="gamemodes"
        ></div>


        <div class="section-title">
            Test History
        </div>


        <div
            class="history"
            id="history"
        >

            <div class="empty">
                No tests completed yet.
            </div>

        </div>


    </div>

</div>


<script type="module">

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
    auth,
    app
} from "./firebase.js";


const database =
    getDatabase(app);


/*
    CLOUDFLARE WORKER
*/

const MINECRAFT_API =
    "https://rotierlist-minecraft.denizzzezw.workers.dev";


/*
    ELEMENTS
*/

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const profile =
    document.getElementById("profile");

const minecraftName =
    document.getElementById("minecraftName");

const skin =
    document.getElementById("skin");

const badges =
    document.getElementById("badges");

const uuid =
    document.getElementById("uuid");

const overallTier =
    document.getElementById("overallTier");

const rankedModes =
    document.getElementById("rankedModes");

const tests =
    document.getElementById("tests");

const region =
    document.getElementById("region");

const regionSelect =
    document.getElementById("regionSelect");

const saveRegion =
    document.getElementById("saveRegion");

const regionStatus =
    document.getElementById("regionStatus");

const gamemodes =
    document.getElementById("gamemodes");


/*
    GAMEMODES
*/

const modeNames = {

    vanilla: "Vanilla",
    sword: "Sword",
    axe: "Axe",
    uhc: "UHC",
    pot: "Pot",
    mace: "Mace",
    smp: "SMP",
    crystal: "Crystal"

};


/*
    CURRENT PLAYER
*/

let currentUser = null;

let currentPlayer = null;


/*
    DEFAULT TIERS
*/

function getDefaultTiers() {

    return {

        vanilla: "Unranked",
        sword: "Unranked",
        axe: "Unranked",
        uhc: "Unranked",
        pot: "Unranked",
        mace: "Unranked",
        smp: "Unranked",
        crystal: "Unranked"

    };

}


/*
    MINECRAFT LOOKUP
*/

async function lookupMinecraft(username) {

    try {

        const response =
            await fetch(
                `${MINECRAFT_API}/?username=${encodeURIComponent(username)}`
            );


        if (!response.ok) {

            throw new Error(
                "Minecraft lookup failed"
            );

        }


        const data =
            await response.json();


        return data;

    }

    catch (error) {

        console.error(
            "Minecraft lookup error:",
            error
        );


        return {

            success: false,

            username: username,

            uuid: null,

            accountType: "unknown"

        };

    }

}


/*
    CREATE MISSING PROFILE
*/

async function createMissingProfile(user) {

    const minecraftUsername =
        user.displayName?.trim();


    if (!minecraftUsername) {

        throw new Error(
            "Your Minecraft name is missing from your account."
        );

    }


    const minecraftData =
        await lookupMinecraft(
            minecraftUsername
        );


    let accountType =
        "unknown";


    let playerUUID =
        null;


    if (
        minecraftData &&
        minecraftData.success
    ) {

        accountType =
            minecraftData.accountType ||
            "unknown";


        playerUUID =
            minecraftData.uuid ||
            null;

    }


    const playerData = {

        minecraftName:
            minecraftUsername,

        uuid:
            playerUUID,

        accountType:
            accountType,

        region:
            "EU",

        tiers:
            getDefaultTiers(),

        stats: {

            tests: 0,

            wins: 0,

            losses: 0

        },

        createdAt:
            Date.now()

    };


    await set(
        ref(
            database,
            `players/${user.uid}`
        ),
        playerData
    );


    await set(
        ref(
            database,
            `users/${user.uid}`
        ),
        {

            minecraftName:
                minecraftUsername,

            uuid:
                playerUUID,

            accountType:
                accountType,

            region:
                "EU",

            email:
                user.email || "",

            createdAt:
                Date.now()

        }
    );


    return playerData;

}


/*
    SKIN URL
*/

function getSkinUrl(player) {

    if (player.uuid) {

        return `https://mc-heads.net/body/${player.uuid}/200`;

    }


    if (player.minecraftName) {

        return `https://mc-heads.net/body/${encodeURIComponent(
            player.minecraftName
        )}/200`;

    }


    return "";

}


/*
    OVERALL TIER
*/

function getOverallTier(tiers) {

    const values =
        Object.values(
            tiers || {}
        );


    const ranked =
        values.filter(
            tier =>
                tier &&
                tier !== "Unranked"
        );


    if (!ranked.length) {

        return "Unranked";

    }


    return ranked[0];

}


/*
    BADGES
*/

function renderBadges(player) {

    badges.innerHTML = "";


    /*
        ACCOUNT TYPE
    */

    const accountBadge =
        document.createElement("div");


    accountBadge.className =
        "badge";


    if (
        player.accountType ===
        "premium"
    ) {

        accountBadge.classList.add(
            "premium"
        );

        accountBadge.textContent =
            "✓ Premium";

    }

    else {

        accountBadge.classList.add(
            "unknown"
        );

        accountBadge.textContent =
            "⚠ Unverified";

    }


    badges.appendChild(
        accountBadge
    );


    /*
        REGION
    */

    const regionBadge =
        document.createElement("div");


    regionBadge.className =
        "badge";


    regionBadge.textContent =
        "🌍 " +
        (player.region || "EU");


    badges.appendChild(
        regionBadge
    );


    /*
        RANKED
    */

    const tierValues =
        Object.values(
            player.tiers || {}
        );


    const isRanked =
        tierValues.some(
            tier =>
                tier &&
                tier !== "Unranked"
        );


    const rankedBadge =
        document.createElement("div");


    rankedBadge.className =
        "badge";


    if (isRanked) {

        rankedBadge.classList.add(
            "ranked"
        );

        rankedBadge.textContent =
            "✓ Ranked";

    }

    else {

        rankedBadge.textContent =
            "Unranked";

    }


    badges.appendChild(
        rankedBadge
    );

}


/*
    GAMEMODES
*/

function renderGamemodes(player) {

    gamemodes.innerHTML = "";


    const tiers =
        player.tiers || {};


    let ranked =
        0;


    Object.entries(modeNames)
        .forEach(
            ([key, name]) => {


                const tier =
                    tiers[key] ||
                    "Unranked";


                if (
                    tier !==
                    "Unranked"
                ) {

                    ranked++;

                }


                const card =
                    document.createElement("div");


                card.className =
                    "gamemode";


                const tierClass =
                    tier !== "Unranked"
                        ? "ranked"
                        : "";


                let serverName =
                    "Not tested";


                if (
                    player.accountType ===
                    "premium"
                ) {

                    serverName =
                        "MCPVP.CLUB";

                }

                else if (
                    player.accountType ===
                    "cracked"
                ) {

                    serverName =
                        "CRAFTIFY.LOL";

                }


                card.innerHTML = `

                    <div class="gamemode-name">
                        ${name}
                    </div>

                    <div class="tier ${tierClass}">
                        ${tier}
                    </div>

                    <div class="server">
                        ${serverName}
                    </div>

                `;


                gamemodes.appendChild(
                    card
                );

            }
        );


    rankedModes.textContent =
        `${ranked}/8`;

}


/*
    REGION UI
*/

function setRegionUI(playerRegion) {

    const selectedRegion =
        playerRegion || "EU";


    region.textContent =
        selectedRegion;


    regionSelect.value =
        selectedRegion;

}


/*
    SAVE REGION
*/

saveRegion.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            return;

        }


        const selectedRegion =
            regionSelect.value;


        saveRegion.disabled =
            true;


        regionStatus.style.display =
            "none";


        try {

            await update(
                ref(
                    database,
                    `players/${currentUser.uid}`
                ),
                {

                    region:
                        selectedRegion

                }
            );


            await update(
                ref(
                    database,
                    `users/${currentUser.uid}`
                ),
                {

                    region:
                        selectedRegion

                }
            );


            if (currentPlayer) {

                currentPlayer.region =
                    selectedRegion;

            }


            region.textContent =
                selectedRegion;


            renderBadges(
                currentPlayer
            );


            regionStatus.style.display =
                "inline";


            setTimeout(
                () => {

                    regionStatus.style.display =
                        "none";

                },
                2000
            );

        }

        catch (err) {

            console.error(
                err
            );


            alert(
                "Could not save region."
            );

        }

        finally {

            saveRegion.disabled =
                false;

        }

    }
);


/*
    LOAD PROFILE
*/

async function loadProfile(user) {

    currentUser =
        user;


    try {

        let snapshot =
            await get(
                ref(
                    database,
                    `players/${user.uid}`
                )
            );


        /*
            PROFILE DOES NOT EXIST
            CREATE IT AUTOMATICALLY
        */

        if (!snapshot.exists()) {

            loading.textContent =
                "Setting up your profile...";


            const newProfile =
                await createMissingProfile(
                    user
                );


            currentPlayer =
                newProfile;

        }

        else {

            currentPlayer =
                snapshot.val();

        }


        /*
            DEFAULT VALUES
        */

        if (
            !currentPlayer.tiers
        ) {

            currentPlayer.tiers =
                getDefaultTiers();

        }


        if (
            !currentPlayer.stats
        ) {

            currentPlayer.stats = {

                tests: 0,

                wins: 0,

                losses: 0

            };

        }


        if (
            !currentPlayer.region
        ) {

            currentPlayer.region =
                "EU";

        }


        /*
            NAME
        */

        const playerName =
            currentPlayer.minecraftName ||
            user.displayName ||
            "Unknown";


        minecraftName.textContent =
            playerName;


        /*
            UUID
        */

        uuid.textContent =
            currentPlayer.uuid
                ? "UUID: " +
                  currentPlayer.uuid
                : "UUID: Not available";


        /*
            SKIN
        */

        skin.src =
            getSkinUrl(
                currentPlayer
            );


        skin.onerror =
            () => {

                if (
                    currentPlayer.minecraftName
                ) {

                    skin.src =
                        `https://mc-heads.net/body/${encodeURIComponent(
                            currentPlayer.minecraftName
                        )}/200`;

                }

            };


        /*
            REGION
        */

        setRegionUI(
            currentPlayer.region
        );


        /*
            TESTS
        */

        tests.textContent =
            currentPlayer.stats?.tests ||
            0;


        /*
            OVERALL
        */

        overallTier.textContent =
            getOverallTier(
                currentPlayer.tiers
            );


        /*
            BADGES
        */

        renderBadges(
            currentPlayer
        );


        /*
            GAMEMODES
        */

        renderGamemodes(
            currentPlayer
        );


        /*
            SHOW PROFILE
        */

        loading.style.display =
            "none";


        errorBox.style.display =
            "none";


        profile.style.display =
            "block";

    }


    catch (err) {

        console.error(
            "Profile error:",
            err
        );


        loading.style.display =
            "none";


        profile.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Could not load profile: " +
            (
                err.message ||
                "Unknown error"
            );

    }

}


/*
    AUTH
*/

onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        loadProfile(
            user
        );

    }
);

</script>


<script
    type="module"
    src="./auth-ui.js"
></script>


</body>

</html>
