<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | RO TierList</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172033 0%,
                    #080b12 45%,
                    #05070b 100%
                );

            color: white;

        }


        .login-box {

            width: 420px;
            max-width: 92%;

            padding: 34px;

            background:
                rgba(15,20,32,0.94);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.45);

        }


        .logo {

            text-align: center;

            font-size: 27px;

            font-weight: 900;

            margin-bottom: 8px;

        }


        .logo span {
            color: #8b5cf6;
        }


        .subtitle {

            text-align: center;

            color: #8e98aa;

            font-size: 14px;

            margin-bottom: 28px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #d7dbe4;

            font-size: 13px;

            font-weight: 700;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 17px;

            border-radius: 10px;

            border:
                1px solid #252c3b;

            background: #0b0f18;

            color: white;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139,92,246,0.12);

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6d3ee8
                );

            color: white;

            font-weight: 800;

            font-size: 14px;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 30px rgba(139,92,246,0.25);

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        .forgot {

            display: block;

            text-align: right;

            margin-top: -7px;

            margin-bottom: 20px;

            color: #a78bfa;

            font-size: 12px;

            cursor: pointer;

        }


        .forgot:hover {
            color: #c4b5fd;
        }


        .message {

            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;

            line-height: 1.5;

        }


        .error {

            display: block;

            background:
                rgba(239,68,68,0.1);

            border:
                1px solid rgba(239,68,68,0.25);

            color: #ff8b8b;

        }


        .success {

            display: block;

            background:
                rgba(34,197,94,0.1);

            border:
                1px solid rgba(34,197,94,0.25);

            color: #75e69b;

        }


        .resend {

            display: none;

            margin-top: 10px;

            background: #151925;

            border:
                1px solid rgba(255,255,255,0.08);

        }


        .register {

            text-align: center;

            margin-top: 22px;

            color: #8992a3;

            font-size: 13px;

        }


        .register a {

            color: #a78bfa;

            text-decoration: none;

            font-weight: 700;

        }


        .back {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #697386;

            font-size: 12px;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        RO <span>TierList</span>
    </div>


    <div class="subtitle">
        Login to your Minecraft PvP account
    </div>


    <form id="loginForm">


        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
        >


        <div
            id="forgot"
            class="forgot"
        >
            Forgot password?
        </div>


        <button
            id="loginButton"
            type="submit"
        >
            LOGIN
        </button>


    </form>


    <button
        id="resendButton"
        class="resend"
        type="button"
    >
        RESEND VERIFICATION EMAIL
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Back to website
    </a>


</div>


<script type="module">

import {
    signInWithEmailAndPassword,
    sendEmailVerification,
    sendPasswordResetEmail,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import { auth } from "./firebase.js";


const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const resendButton =
    document.getElementById("resendButton");

const forgot =
    document.getElementById("forgot");

const message =
    document.getElementById("message");


let currentUser = null;


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/*
 * LOGIN
 */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "Enter your email and password.",
                "error"
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "LOGGING IN...";

        resendButton.style.display =
            "none";


        try {

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            currentUser =
                result.user;


            /*
             * We currently allow login even
             * if the email is not verified.
             */

            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            button.textContent =
                "SUCCESS";


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                700
            );


        }

        catch (error) {

            console.error(
                "FIREBASE LOGIN ERROR:",
                error
            );


            let errorMessage =
                "A aparut o eroare. Incearca din nou.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                errorMessage =
                    "Emailul sau parola sunt gresite.";

            }


            else if (
                error.code ===
                "auth/invalid-login-credentials"
            ) {

                errorMessage =
                    "Emailul sau parola sunt gresite.";

            }


            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                errorMessage =
                    "Parola este gresita.";

            }


            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                errorMessage =
                    "Nu exista un cont cu acest email.";

            }


            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                errorMessage =
                    "Prea multe incercari. Asteapta putin si incearca din nou.";

            }


            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorMessage =
                    "Problema de conexiune. Verifica internetul.";

            }


            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                errorMessage =
                    "Login-ul cu Email/Password nu este activat in Firebase.";

            }


            else {

                /*
                 * IMPORTANT:
                 * Show the real Firebase error code
                 * so we can diagnose it.
                 */

                errorMessage =
                    "Firebase: " +
                    (
                        error.code ||
                        "unknown-error"
                    );

            }


            showMessage(
                errorMessage,
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "LOGIN";


            if (
                error.code ===
                "auth/email-not-verified"
            ) {

                resendButton.style.display =
                    "block";

            }

        }

    }
);


/*
 * RESEND VERIFICATION
 */

resendButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            showMessage(
                "Logheaza-te mai intai.",
                "error"
            );

            return;

        }


        try {

            await sendEmailVerification(
                currentUser
            );


            showMessage(
                "Verification email sent.",
                "success"
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "Firebase: " +
                (
                    error.code ||
                    "unknown-error"
                ),
                "error"
            );

        }

    }
);


/*
 * PASSWORD RESET
 */

forgot.addEventListener(
    "click",
    async () => {

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        if (!email) {

            showMessage(
                "Enter your email first.",
                "error"
            );

            return;

        }


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Password reset email sent. Check your inbox.",
                "success"
            );

        }

        catch (error) {

            console.error(error);

            let text =
                "Firebase: " +
                (
                    error.code ||
                    "unknown-error"
                );


            if (
                error.code ===
                "auth/user-not-found"
            ) {

                text =
                    "Nu exista un cont cu acest email.";

            }


            showMessage(
                text,
                "error"
            );

        }

    }
);

</script>


<script
    type="module"
    src="./auth-ui.js"
></script>


</body>

</html>
