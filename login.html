<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ROTierList</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0d;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid #24242a;
            background: #0d0d0f;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #8b5cf6;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

        .discord {
            background: #5865f2;
            color: white !important;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: 700;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            background: #111114;
            border: 1px solid #28282f;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #8f8f99;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #d4d4d8;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid #303038;
            background: #0b0b0e;
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -7px;
            margin-bottom: 20px;
            color: #9b7cff;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot:hover {
            color: #b5a0ff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #8b5cf6;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #7c4ee8;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 17px;
            padding: 12px 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .resend {
            display: none;
            margin-top: 10px;
            background: #202027;
            border: 1px solid #35353e;
        }

        .resend:hover {
            background: #292932;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #8f8f99;
            font-size: 14px;
        }

        .register a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
        }

        .register a:hover {
            color: #c4b5fd;
        }

        @media (max-width: 800px) {
            .nav-links a:not(.discord) {
                display: none;
            }

            nav {
                padding: 0 18px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">
        RO<span>Tier</span>List
    </a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="players.html">Players</a>
        <a href="leaderboards.html">Leaderboards</a>
        <a href="results.html">Results</a>
        <a href="tiers.html">Tiers</a>
        <a href="https://discord.gg/bms3jPBD9p" target="_blank" class="discord">
            Discord
        </a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <h1 class="title">Welcome back</h1>

        <p class="subtitle">
            Login to your ROTierList account
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <a class="forgot" id="forgotPassword">
                Forgot password?
            </a>

            <button type="submit" id="loginBtn">
                Login
            </button>

            <button
                type="button"
                id="resendBtn"
                class="resend"
            >
                Resend verification email
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create one</a>
        </div>

    </div>

</div>

<script type="module">

    import {
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        sendEmailVerification,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "./firebase.js";


    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const loginBtn = document.getElementById("loginBtn");
    const resendBtn = document.getElementById("resendBtn");

    const forgotPassword = document.getElementById("forgotPassword");
    const message = document.getElementById("message");


    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className = "message " + type;
    }


    function clearMessage() {

        message.textContent = "";

        message.className = "message";
    }


    /*
     * LOGIN
     */

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        clearMessage();

        const email = emailInput.value.trim();
        const password = passwordInput.value;


        if (!email || !password) {

            showMessage("Completeaza toate campurile.");

            return;
        }


        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";


        try {

            const result = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = result.user;


            /*
             * TEMPORAR:
             * Nu mai blocam login-ul daca emailul
             * nu este verificat.
             */

            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            setTimeout(() => {

                window.location.href = "index.html";

            }, 500);


        } catch (error) {

            console.error(error);

            if (
                error.code === "auth/invalid-credential" ||
                error.code === "auth/wrong-password" ||
                error.code === "auth/user-not-found"
            ) {

                showMessage(
                    "Emailul sau parola sunt gresite."
                );

            }

            else if (error.code === "auth/invalid-email") {

                showMessage(
                    "Adresa de email nu este valida."
                );

            }

            else if (error.code === "auth/too-many-requests") {

                showMessage(
                    "Prea multe incercari. Incearca din nou mai tarziu."
                );

            }

            else {

                showMessage(
                    "A aparut o eroare. Incearca din nou."
                );

            }

        }


        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

    });


    /*
     * FORGOT PASSWORD
     */

    forgotPassword.addEventListener("click", async () => {

        clearMessage();

        const email = emailInput.value.trim();


        if (!email) {

            showMessage(
                "Introdu emailul tau mai intai."
            );

            emailInput.focus();

            return;
        }


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Am trimis un email pentru resetarea parolei. Verifica Inbox si Spam.",
                "success"
            );


        } catch (error) {

            console.error(error);


            if (error.code === "auth/user-not-found") {

                showMessage(
                    "Nu exista niciun cont cu acest email."
                );

            }

            else if (error.code === "auth/invalid-email") {

                showMessage(
                    "Emailul introdus nu este valid."
                );

            }

            else {

                showMessage(
                    "Nu am putut trimite emailul de resetare."
                );

            }

        }

    });


    /*
     * RESEND VERIFICATION
     *
     * Pastreaza butonul pentru mai tarziu.
     */

    resendBtn.addEventListener("click", async () => {

        clearMessage();

        const email = emailInput.value.trim();
        const password = passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Introdu emailul si parola pentru a retrimite verificarea."
            );

            return;
        }


        resendBtn.disabled = true;
        resendBtn.textContent = "Sending...";


        try {

            const result = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = result.user;


            if (user.emailVerified) {

                showMessage(
                    "Emailul tau este deja verificat.",
                    "success"
                );

            } else {

                await sendEmailVerification(user);

                showMessage(
                    "Emailul de verificare a fost retrimis. Verifica Inbox, Spam si Promotions.",
                    "success"
                );

            }


            await signOut(auth);


        } catch (error) {

            console.error(error);

            showMessage(
                "Nu am putut retrimite emailul de verificare."
            );

        }


        resendBtn.disabled = false;
        resendBtn.textContent = "Resend verification email";

    });

</script>

</body>
</html>
