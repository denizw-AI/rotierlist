<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RO Tier List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.14), transparent 35%),
                #07070b;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            height: 72px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.07);
            background: rgba(7,7,11,.78);
            backdrop-filter: blur(15px);
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-size: 21px;
            font-weight: 800;
        }

        .logo span {
            color: #8b5cf6;
        }

        .nav-links {
            display: flex;
            gap: 26px;
            align-items: center;
        }

        .nav-links a {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: .2s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-login {
            color: #fff !important;
            padding: 10px 17px;
            border-radius: 9px;
            background: rgba(139,92,246,.15);
            border: 1px solid rgba(139,92,246,.3);
        }

        main {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            border-radius: 18px;
            background: rgba(15,15,22,.9);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow:
                0 25px 80px rgba(0,0,0,.45),
                0 0 50px rgba(139,92,246,.08);
        }

        .icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: rgba(139,92,246,.13);
            border: 1px solid rgba(139,92,246,.25);
            font-size: 24px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #bbb;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.09);
            outline: none;
            background: #0b0b10;
            color: #fff;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: rgba(139,92,246,.65);
            box-shadow: 0 0 0 3px rgba(139,92,246,.08);
        }

        input::placeholder {
            color: #555;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #8b5cf6;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .resend {
            display: none;
            margin-top: 10px;
            background: transparent;
            border: 1px solid rgba(139,92,246,.35);
            color: #a78bfa;
        }

        .resend:hover {
            background: rgba(139,92,246,.08);
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #ff8d8d;
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.2);
        }

        .message.success {
            display: block;
            color: #9df5bb;
            background: rgba(34,197,94,.08);
            border: 1px solid rgba(34,197,94,.2);
        }

        .register {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,.07);
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        .register a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }

        .register a:hover {
            text-decoration: underline;
        }

        @media (max-width: 850px) {
            .nav-links {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">
        RO<span>TierList</span>
    </a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="players.html">Players</a>
        <a href="leaderboards.html">Leaderboards</a>
        <a href="results.html">Results</a>
        <a href="tiers.html">Tiers</a>
        <a href="https://discord.gg/bms3jPBD9p" target="_blank">Discord</a>
        <a href="login.html" class="nav-login">Login</a>
    </div>
</nav>

<main>

    <div class="login-box">

        <div class="icon">🔐</div>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Login to your RO TierList account
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <a href="#" class="forgot" id="forgotPassword">
                Forgot password?
            </a>

            <button type="submit" id="loginButton">
                Login
            </button>

            <button
                type="button"
                class="resend"
                id="resendButton"
            >
                Resend verification email
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create one</a>
        </div>

    </div>

</main>

<script type="module">

    import {
        signInWithEmailAndPassword,
        sendEmailVerification,
        sendPasswordResetEmail,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "./firebase.js";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const resendButton = document.getElementById("resendButton");
    const message = document.getElementById("message");
    const forgotPassword = document.getElementById("forgotPassword");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    function getFirebaseError(error) {

        switch (error.code) {

            case "auth/invalid-credential":
                return "Emailul sau parola sunt incorecte.";

            case "auth/invalid-email":
                return "Introdu o adresă de email validă.";

            case "auth/user-disabled":
                return "Acest cont a fost dezactivat.";

            case "auth/too-many-requests":
                return "Prea multe încercări. Încearcă din nou mai târziu.";

            default:
                return "A apărut o eroare. Încearcă din nou.";
        }
    }

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        if (!email || !password) {
            showMessage(
                "Completează emailul și parola.",
                "error"
            );
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        resendButton.style.display = "none";

        try {

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user = userCredential.user;

            /*
             * Verificăm dacă emailul a fost confirmat.
             */
            if (!user.emailVerified) {

                showMessage(
                    "Emailul tău nu este verificat încă. Verifică inbox-ul sau trimite din nou emailul.",
                    "error"
                );

                resendButton.style.display = "block";

                await signOut(auth);

                loginButton.disabled = false;
                loginButton.textContent = "Login";

                return;
            }

            /*
             * Login successful.
             */
            showMessage(
                "Login successful! Redirecting...",
                "success"
            );

            loginButton.textContent = "Logged in";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);

        } catch (error) {

            console.error(error);

            showMessage(
                getFirebaseError(error),
                "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    });

    /*
     * Resend verification email
     */
    resendButton.addEventListener("click", async () => {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        if (!email || !password) {
            showMessage(
                "Introdu emailul și parola mai întâi.",
                "error"
            );
            return;
        }

        resendButton.disabled = true;
        resendButton.textContent = "Sending...";

        try {

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user = userCredential.user;

            if (user.emailVerified) {

                showMessage(
                    "Emailul este deja verificat. Poți să te loghezi.",
                    "success"
                );

                await signOut(auth);

                resendButton.style.display = "none";
                resendButton.disabled = false;
                resendButton.textContent =
                    "Resend verification email";

                return;
            }

            await sendEmailVerification(user);

            await signOut(auth);

            showMessage(
                "Emailul de verificare a fost retrimis. Verifică și folderul Spam/Junk.",
                "success"
            );

            resendButton.disabled = false;
            resendButton.textContent =
                "Resend verification email";

        } catch (error) {

            console.error(error);

            showMessage(
                getFirebaseError(error),
                "error"
            );

            resendButton.disabled = false;
            resendButton.textContent =
                "Resend verification email";
        }
    });

    /*
     * Forgot password
     */
    forgotPassword.addEventListener("click", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        if (!email) {

            showMessage(
                "Introdu emailul pentru care vrei să resetezi parola.",
                "error"
            );

            document.getElementById("email").focus();

            return;
        }

        try {

            await sendPasswordResetEmail(
                auth,
                email
            );

            showMessage(
                "Emailul pentru resetarea parolei a fost trimis. Verifică inbox-ul și Spam/Junk.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showMessage(
                getFirebaseError(error),
                "error"
            );
        }
    });

</script>

</body>
</html>
