<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaderboards | RO TierList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(124,92,255,0.18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(80,120,255,0.08),
                    transparent 28%
                ),
                #08080d;

            color: white;

            padding: 120px 20px 70px;

        }

        .container {

            width: 100%;
            max-width: 1200px;
            margin: auto;

        }

        .header {

            text-align: center;
            margin-bottom: 30px;

        }

        .header h1 {

            font-size: 46px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 10px;

        }

        .header p {

            color: #777783;
            font-size: 14px;

        }

        .tabs {

            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;

        }

        .tab {

            padding: 12px 25px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.08);

            background: #111119;

            color: #858592;

            font-weight: 900;

            cursor: pointer;

            transition: 0.2s;

        }

        .tab:hover {

            color: white;

            border-color:
                rgba(124,92,255,0.35);

        }

        .tab.active {

            background:
                rgba(124,92,255,0.15);

            color: #b99cff;

            border-color:
                rgba(124,92,255,0.35);

            box-shadow:
                0 0 25px rgba(124,92,255,0.08);

        }

        .gamemodes {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 18px;

        }

        .mode {

            padding: 9px 16px;

            border-radius: 9px;

            background: #101017;

            border:
                1px solid rgba(255,255,255,0.06);

            color: #777783;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;

        }

        .mode:hover {

            color: white;

        }

        .mode.active {

            background:
                rgba(124,92,255,0.14);

            border-color:
                rgba(124,92,255,0.3);

            color: #b99cff;

        }

        .database-status {

            text-align: center;

            color: #65e6a0;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 0.7px;

            margin-bottom: 25px;

        }

        .loading {

            text-align: center;

            padding: 80px 20px;

            color: #777783;

        }

        .error {

            display: none;

            text-align: center;

            padding: 35px 20px;

            color: #ff7777;

            background:
                rgba(255,70,70,0.05);

            border:
                1px solid rgba(255,70,70,0.15);

            border-radius: 18px;

        }

        .empty {

            text-align: center;

            padding: 70px 20px;

            background:
                rgba(15,15,23,0.94);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 20px;

            color: #777783;

        }

        .empty strong {

            color: #b99cff;

        }

        /*
            PODIUM
        */

        .podium {

            display: grid;

            grid-template-columns:
                1fr 1.15fr 1fr;

            align-items: end;

            gap: 15px;

            margin-bottom: 30px;

        }

        .podium-card {

            position: relative;

            overflow: hidden;

            padding: 25px 20px;

            background:
                linear-gradient(
                    180deg,
                    rgba(25,25,37,0.98),
                    rgba(13,13,20,0.98)
                );

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 22px;

            text-align: center;

        }

        .podium-card.first {

            min-height: 370px;

            border-color:
                rgba(255,210,80,0.28);

            box-shadow:
                0 0 35px rgba(255,210,80,0.04);

        }

        .podium-card.second {

            min-height: 315px;

            border-color:
                rgba(200,200,220,0.2);

        }

        .podium-card.third {

            min-height: 290px;

            border-color:
                rgba(190,130,80,0.2);

        }

        .position {

            font-size: 12px;

            color: #777783;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }

        .first .position {

            color: #ffd45c;

        }

        .second .position {

            color: #d0d0dc;

        }

        .third .position {

            color: #cd9868;

        }

        .podium-skin {

            height: 185px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            margin-bottom: 5px;

        }

        .first .podium-skin {

            height: 215px;

        }

        .podium-skin img {

            max-height: 100%;

            max-width: 135px;

            image-rendering: pixelated;

        }

        .podium-name {

            font-size: 22px;

            font-weight: 900;

            margin-top: 10px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }

        .podium-tier {

            display: inline-block;

            margin-top: 8px;

            padding: 6px 11px;

            border-radius: 8px;

            background:
                rgba(124,92,255,0.13);

            color: #b99cff;

            font-size: 12px;

            font-weight: 900;

        }

        .podium-region {

            color: #666672;

            font-size: 10px;

            margin-top: 8px;

        }

        /*
            LIST
        */

        .leaderboard-list {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }

        .player-row {

            display: grid;

            grid-template-columns:
                55px 65px 1fr 130px 90px;

            align-items: center;

            gap: 15px;

            min-height: 78px;

            padding: 10px 18px;

            background:
                rgba(15,15,23,0.94);

            border:
                1px solid rgba(255,255,255,0.06);

            border-radius: 15px;

            transition: 0.2s;

        }

        .player-row:hover {

            transform: translateY(-1px);

            border-color:
                rgba(124,92,255,0.28);

            background:
                rgba(18,18,28,0.98);

        }

        .rank {

            text-align: center;

            font-size: 15px;

            font-weight: 900;

            color: #555561;

        }

        .row-skin {

            height: 58px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            overflow: hidden;

        }

        .row-skin img {

            height: 58px;

            max-width: 55px;

            image-rendering: pixelated;

        }

        .player-name {

            font-size: 15px;

            font-weight: 900;

            margin-bottom: 5px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }

        .player-region {

            color: #666672;

            font-size: 10px;

        }

        .account {

            font-size: 10px;

            font-weight: 900;

            color: #65e6a0;

        }

        .account.cracked {

            color: #ffc85a;

        }

        .tier-box {

            display: flex;

            align-items: center;

            gap: 8px;

        }

        .tier-icon {

            width: 23px;

            height: 23px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 6px;

            background: #171720;

            font-size: 11px;

        }

        .tier {

            font-size: 17px;

            font-weight: 900;

        }

        .tests {

            color: #666672;

            font-size: 10px;

            text-align: right;

        }

        @media (max-width: 750px) {

            .podium {

                grid-template-columns: 1fr;

            }

            .podium-card.first,
            .podium-card.second,
            .podium-card.third {

                min-height: auto;

            }

            .first {
                order: 1;
            }

            .second {
                order: 2;
            }

            .third {
                order: 3;
            }

            .player-row {

                grid-template-columns:
                    35px 50px 1fr 70px;

                gap: 8px;

            }

            .tests {

                display: none;

            }

        }

        @media (max-width: 500px) {

            body {

                padding-left: 10px;
                padding-right: 10px;

            }

            .header h1 {

                font-size: 34px;

            }

            .player-row {

                grid-template-columns:
                    30px 45px 1fr 55px;

                padding: 8px;

            }

            .row-skin,
            .row-skin img {

                height: 50px;

            }

            .tier {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>

<div class="container">


    <div class="header">

        <h1>
            Leaderboards
        </h1>

        <p>
            Ranked players on RO TierList
        </p>

    </div>


    <div class="tabs">

        <button
            id="premiumTab"
            class="tab"
        >
            Premium
        </button>

        <button
            id="crackedTab"
            class="tab"
        >
            Cracked
        </button>

    </div>


    <div
        id="gamemodes"
        class="gamemodes"
    ></div>


    <div
        class="database-status"
    >
        ● LIVE DATABASE
    </div>


    <div
        id="loading"
        class="loading"
    >
        Loading players...
    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="content"
        style="display:none;"
    >

        <div
            id="podium"
            class="podium"
        ></div>


        <div
            id="leaderboardList"
            class="leaderboard-list"
        ></div>

    </div>


</div>


<script type="module">


/*
    FIREBASE
*/

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
    app
}
from "./firebase.js";


const database =
    getDatabase(app);


/*
    ELEMENTS
*/

const premiumTab =
    document.getElementById(
        "premiumTab"
    );

const crackedTab =
    document.getElementById(
        "crackedTab"
    );

const gamemodes =
    document.getElementById(
        "gamemodes"
    );

const loading =
    document.getElementById(
        "loading"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const content =
    document.getElementById(
        "content"
    );

const podium =
    document.getElementById(
        "podium"
    );

const leaderboardList =
    document.getElementById(
        "leaderboardList"
    );


/*
    STATE
*/

let allPlayers = {};

let selectedGamemode =
    "sword";


let accountMode =
    window.location.hash.toLowerCase() ===
    "#cracked"
        ? "cracked"
        : "premium";


/*
    GAMEMODES
*/

const modeNames = {

    vanilla: "Vanilla",
    sword: "Sword",
    axe: "Axe",
    uhc: "UHC",
    pot: "Pot",
    mace: "Mace",
    smp: "SMP",
    crystal: "Crystal"

};


/*
    ICONS
*/

const modeIcons = {

    vanilla: "⚔",
    sword: "⚔",
    axe: "🪓",
    uhc: "❤",
    pot: "🧪",
    mace: "🔨",
    smp: "🌿",
    crystal: "💎"

};


/*
    TIER ORDER

    HT1 = BEST
    LT5 = LOWEST RANKED
*/

const tierOrder = {

    HT1: 10,
    LT1: 9,

    HT2: 8,
    LT2: 7,

    HT3: 6,
    LT3: 5,

    HT4: 4,
    LT4: 3,

    HT5: 2,
    LT5: 1

};


/*
    CREATE GAMEMODE BUTTONS
*/

Object.entries(
    modeNames
).forEach(
    ([key, name]) => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "mode";


        if (
            key ===
            selectedGamemode
        ) {

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            name;


        button.dataset.mode =
            key;


        button.addEventListener(
            "click",
            () => {

                selectedGamemode =
                    key;


                document
                    .querySelectorAll(
                        ".mode"
                    )
                    .forEach(
                        element =>
                            element.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                renderLeaderboard();

            }
        );


        gamemodes.appendChild(
            button
        );

    }
);


/*
    UPDATE ACCOUNT TABS
*/

function updateTabs() {

    if (
        accountMode ===
        "premium"
    ) {

        premiumTab.classList.add(
            "active"
        );

        crackedTab.classList.remove(
            "active"
        );

    } else {

        crackedTab.classList.add(
            "active"
        );

        premiumTab.classList.remove(
            "active"
        );

    }

}


updateTabs();


/*
    PREMIUM TAB
*/

premiumTab.addEventListener(
    "click",
    () => {

        accountMode =
            "premium";

        updateTabs();

        history.replaceState(
            null,
            "",
            window.location.pathname
        );

        renderLeaderboard();

    }
);


/*
    CRACKED TAB
*/

crackedTab.addEventListener(
    "click",
    () => {

        accountMode =
            "cracked";

        updateTabs();

        history.replaceState(
            null,
            "",
            window.location.pathname +
            "#cracked"
        );

        renderLeaderboard();

    }
);


/*
    GET SCORE
*/

function getTierScore(tier) {

    return tierOrder[tier] || 0;

}


/*
    GET RANKED PLAYERS
*/

function getRankedPlayers() {

    const ranked = [];


    Object.entries(
        allPlayers
    ).forEach(
        ([uid, player]) => {

            if (
                !player
            ) {
                return;
            }


            /*
                PREMIUM / CRACKED
            */

            if (
                accountMode ===
                "premium"
            ) {

                if (
                    player.accountType !==
                    "premium"
                ) {

                    return;

                }

            } else {

                if (
                    player.accountType !==
                    "cracked"
                ) {

                    return;

                }

            }


            /*
                READ TIER DIRECTLY
                FROM FIREBASE
            */

            const tier =
                player.tiers &&
                player.tiers[
                    selectedGamemode
                ];


            /*
                UNRANKED = DON'T SHOW
            */

            if (
                !tier ||
                !tierOrder[tier]
            ) {

                return;

            }


            ranked.push({

                uid: uid,

                player: player,

                tier: tier,

                score:
                    getTierScore(
                        tier
                    )

            });

        }
    );


    /*
        BEST TIER FIRST
    */

    ranked.sort(
        (a, b) => {

            if (
                a.score !==
                b.score
            ) {

                return (
                    b.score -
                    a.score
                );

            }


            /*
                IF SAME TIER,
                MORE TESTS FIRST
            */

            const aTests =
                Number(
                    a.player.stats?.tests || 0
                );


            const bTests =
                Number(
                    b.player.stats?.tests || 0
                );


            if (
                aTests !==
                bTests
            ) {

                return (
                    bTests -
                    aTests
                );

            }


            /*
                FINAL SORT:
                ALPHABETICAL
            */

            return String(
                a.player.minecraftName || ""
            ).localeCompare(
                String(
                    b.player.minecraftName || ""
                )
            );

        }
    );


    return ranked;

}


/*
    SKIN URL
*/

function getSkinURL(player) {

    if (
        player.uuid
    ) {

        return (
            "https://mc-heads.net/body/" +
            encodeURIComponent(
                player.uuid
            ) +
            "/180"
        );

    }


    if (
        player.minecraftName
    ) {

        return (
            "https://mc-heads.net/body/" +
            encodeURIComponent(
                player.minecraftName
            ) +
            "/180"
        );

    }


    return "";

}


/*
    ESCAPE HTML
*/

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
    PODIUM EMPTY CARD
*/

function createEmptyPodium(
    label,
    className
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "podium-card " +
        className;


    card.innerHTML = `

        <div class="position">
            ${label}
        </div>

        <div class="podium-skin">
        </div>

        <div class="podium-name">
            —
        </div>

        <div class="podium-tier">
            Unranked
        </div>

    `;


    return card;

}


/*
    PODIUM
*/

function renderPodium(
    players
) {

    podium.innerHTML = "";


    const second =
        players[1];

    const first =
        players[0];

    const third =
        players[2];


    /*
        TOP 2
    */

    if (
        second
    ) {

        podium.appendChild(
            createPodiumCard(
                second,
                "second",
                "TOP 2"
            )
        );

    } else {

        podium.appendChild(
            createEmptyPodium(
                "TOP 2",
                "second"
            )
        );

    }


    /*
        TOP 1
    */

    if (
        first
    ) {

        podium.appendChild(
            createPodiumCard(
                first,
                "first",
                "TOP 1"
            )
        );

    } else {

        podium.appendChild(
            createEmptyPodium(
                "TOP 1",
                "first"
            )
        );

    }


    /*
        TOP 3
    */

    if (
        third
    ) {

        podium.appendChild(
            createPodiumCard(
                third,
                "third",
                "TOP 3"
            )
        );

    } else {

        podium.appendChild(
            createEmptyPodium(
                "TOP 3",
                "third"
            )
        );

    }

}


/*
    PODIUM PLAYER CARD
*/

function createPodiumCard(
    entry,
    className,
    label
) {

    const player =
        entry.player;


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "podium-card " +
        className;


    card.innerHTML = `

        <div class="position">
            ${label}
        </div>

        <div class="podium-skin">

            <img
                src="${getSkinURL(player)}"
                alt=""
                onerror="this.style.display='none'"
            >

        </div>

        <div class="podium-name">

            ${escapeHTML(
                player.minecraftName ||
                "Unknown"
            )}

        </div>

        <div class="podium-tier">

            ${escapeHTML(
                entry.tier
            )}

        </div>

        <div class="podium-region">

            🌍
            ${escapeHTML(
                player.region ||
                "EU"
            )}

        </div>

    `;


    return card;

}


/*
    PLAYER ROW
*/

function createPlayerRow(
    entry,
    position
) {

    const player =
        entry.player;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "player-row";


    const isCracked =
        player.accountType ===
        "cracked";


    const accountClass =
        isCracked
            ? "cracked"
            : "";


    const accountText =
        isCracked
            ? "CRACKED"
            : "PREMIUM";


    row.innerHTML = `

        <div class="rank">
            #${position}
        </div>

        <div class="row-skin">

            <img
                src="${getSkinURL(player)}"
                alt=""
                onerror="this.style.display='none'"
            >

        </div>

        <div>

            <div class="player-name">

                ${escapeHTML(
                    player.minecraftName ||
                    "Unknown"
                )}

            </div>

            <div class="player-region">

                🌍
                ${escapeHTML(
                    player.region ||
                    "EU"
                )}

                &nbsp; • &nbsp;

                <span class="account ${accountClass}">

                    ${accountText}

                </span>

            </div>

        </div>

        <div class="tier-box">

            <div class="tier-icon">

                ${
                    modeIcons[
                        selectedGamemode
                    ] || "⚔"
                }

            </div>

            <div class="tier">

                ${escapeHTML(
                    entry.tier
                )}

            </div>

        </div>

        <div class="tests">

            ${
                Number(
                    player.stats?.tests ||
                    0
                )
            }
            tests

        </div>

    `;


    /*
        CLICK PLAYER
        OPENS PROFILE SEARCH
    */

    row.style.cursor =
        "pointer";


    row.addEventListener(
        "click",
        () => {

            const name =
                player.minecraftName;


            if (
                name
            ) {

                window.location.href =
                    "players.html?player=" +
                    encodeURIComponent(
                        name
                    );

            }

        }
    );


    return row;

}


/*
    RENDER LIST
*/

function renderList(
    players
) {

    leaderboardList.innerHTML = "";


    /*
        START FROM #4
    */

    players
        .slice(
            3,
            50
        )
        .forEach(
            (entry, index) => {

                leaderboardList.appendChild(
                    createPlayerRow(
                        entry,
                        index + 4
                    )
                );

            }
        );

}


/*
    MAIN RENDER
*/

function renderLeaderboard() {

    const players =
        getRankedPlayers();


    content.style.display =
        "block";


    /*
        NOTHING RANKED
    */

    if (
        players.length === 0
    ) {

        podium.innerHTML = "";

        leaderboardList.innerHTML = `

            <div class="empty">

                No ranked players found for

                <strong>
                    ${escapeHTML(
                        modeNames[
                            selectedGamemode
                        ]
                    )}
                </strong>.

                <br><br>

                Players with a tier will
                automatically appear here.

            </div>

        `;

        return;

    }


    /*
        PODIUM
    */

    renderPodium(
        players
    );


    /*
        #4 - #50
    */

    renderList(
        players
    );

}


/*
    FIREBASE LIVE LISTENER
*/

onValue(

    ref(
        database,
        "players"
    ),

    snapshot => {

        loading.style.display =
            "none";


        errorBox.style.display =
            "none";


        if (
            snapshot.exists()
        ) {

            allPlayers =
                snapshot.val();

        } else {

            allPlayers = {};

        }


        renderLeaderboard();

    },

    firebaseError => {

        console.error(
            "RO TierList Leaderboard Firebase Error:",
            firebaseError
        );


        loading.style.display =
            "none";


        content.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Firebase error: " +
            firebaseError.message;

    }

);

</script>


<script
    type="module"
    src="./auth-ui.js"
></script>
