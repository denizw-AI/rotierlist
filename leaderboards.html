<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Leaderboards | RO TierList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(124,92,255,0.18),
                    transparent 35%
                ),
                #08080d;

            color: white;

            padding: 120px 20px 70px;

        }


        .container {

            width: 100%;
            max-width: 1150px;

            margin: auto;

        }


        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header h1 {

            font-size: 44px;

            font-weight: 900;

            margin-bottom: 10px;

        }


        .header p {

            color: #777783;

            font-size: 14px;

        }


        .tabs {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

        }


        .tab {

            padding: 12px 22px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,0.08);

            background: #111119;

            color: #858592;

            font-weight: 900;

            cursor: pointer;

            transition: 0.2s;

        }


        .tab:hover {

            border-color:
                rgba(124,92,255,0.3);

        }


        .tab.active {

            background:
                rgba(124,92,255,0.14);

            color: #b99cff;

            border-color:
                rgba(124,92,255,0.3);

        }


        .gamemodes {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 35px;

        }


        .mode {

            padding: 9px 15px;

            border-radius: 9px;

            background: #101017;

            border:
                1px solid rgba(255,255,255,0.06);

            color: #777783;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;

        }


        .mode:hover {

            color: white;

        }


        .mode.active {

            background:
                rgba(124,92,255,0.12);

            border-color:
                rgba(124,92,255,0.25);

            color: #b99cff;

        }


        .loading {

            text-align: center;

            padding: 80px 20px;

            color: #777783;

        }


        .error {

            text-align: center;

            padding: 50px 20px;

            color: #ff6b6b;

            display: none;

        }


        .empty {

            text-align: center;

            padding: 70px 20px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 20px;

            color: #777783;

        }


        /*
            PODIUM
        */

        .podium {

            display: grid;

            grid-template-columns:
                1fr 1.15fr 1fr;

            align-items: end;

            gap: 15px;

            margin-bottom: 30px;

        }


        .podium-card {

            position: relative;

            padding: 25px 20px;

            background:
                linear-gradient(
                    180deg,
                    rgba(25,25,37,0.98),
                    rgba(13,13,20,0.98)
                );

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            text-align: center;

            overflow: hidden;

        }


        .podium-card.first {

            min-height: 350px;

            border-color:
                rgba(255,210,80,0.25);

        }


        .podium-card.second {

            min-height: 300px;

            border-color:
                rgba(190,190,210,0.20);

        }


        .podium-card.third {

            min-height: 275px;

            border-color:
                rgba(190,130,80,0.20);

        }


        .position {

            font-size: 12px;

            color: #777783;

            font-weight: 900;

            margin-bottom: 10px;

            letter-spacing: 1px;

        }


        .first .position {

            color: #ffd45c;

        }


        .second .position {

            color: #c8c8d2;

        }


        .third .position {

            color: #cd9868;

        }


        .podium-skin {

            height: 175px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            margin-bottom: 5px;

        }


        .first .podium-skin {

            height: 200px;

        }


        .podium-skin img {

            max-height: 100%;

            max-width: 130px;

            image-rendering: pixelated;

        }


        .podium-name {

            font-size: 22px;

            font-weight: 900;

            margin-top: 10px;

        }


        .podium-tier {

            display: inline-block;

            margin-top: 8px;

            padding: 6px 10px;

            border-radius: 8px;

            background:
                rgba(124,92,255,0.12);

            color: #b99cff;

            font-size: 12px;

            font-weight: 900;

        }


        .podium-region {

            color: #666672;

            font-size: 10px;

            margin-top: 8px;

        }


        /*
            LIST
        */

        .leaderboard-list {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .player-row {

            display: grid;

            grid-template-columns:
                55px 65px 1fr 120px 100px;

            align-items: center;

            gap: 15px;

            min-height: 78px;

            padding: 10px 18px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.06);

            border-radius: 15px;

            transition: 0.2s;

        }


        .player-row:hover {

            transform: translateY(-1px);

            border-color:
                rgba(124,92,255,0.25);

        }


        .rank {

            font-size: 15px;

            font-weight: 900;

            color: #555561;

            text-align: center;

        }


        .row-skin {

            height: 58px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            overflow: hidden;

        }


        .row-skin img {

            height: 58px;

            max-width: 55px;

            image-rendering: pixelated;

        }


        .player-info {

            min-width: 0;

        }


        .player-name {

            font-size: 15px;

            font-weight: 900;

            margin-bottom: 5px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .player-region {

            color: #666672;

            font-size: 10px;

        }


        .tier-box {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .tier {

            font-size: 17px;

            font-weight: 900;

            color: white;

        }


        .tier-icon {

            width: 22px;

            height: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 6px;

            background: #171720;

            font-size: 11px;

        }


        .account {

            color: #65e6a0;

            font-size: 10px;

            font-weight: 800;

        }


        .account.cracked {

            color: #ffc85a;

        }


        .count {

            color: #666672;

            font-size: 10px;

            text-align: right;

        }


        .live {

            text-align: center;

            color: #65e6a0;

            font-size: 10px;

            font-weight: 800;

            margin-bottom: 15px;

        }


        @media (max-width: 750px) {

            .podium {

                grid-template-columns: 1fr;

                align-items: stretch;

            }


            .podium-card.first,
            .podium-card.second,
            .podium-card.third {

                min-height: auto;

            }


            .first {

                order: 1;

            }


            .second {

                order: 2;

            }


            .third {

                order: 3;

            }


            .player-row {

                grid-template-columns:
                    35px 50px 1fr 70px;

                gap: 8px;

            }


            .count {

                display: none;

            }

        }


        @media (max-width: 500px) {

            body {

                padding-left: 10px;

                padding-right: 10px;

            }


            .header h1 {

                font-size: 34px;

            }


            .player-row {

                grid-template-columns:
                    30px 45px 1fr 55px;

                padding: 8px;

            }


            .row-skin,
            .row-skin img {

                height: 50px;

            }


            .tier {

                font-size: 14px;

            }


            .account {

                display: none;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>
            Leaderboards
        </h1>

        <p>
            Ranked players on RO TierList
        </p>

    </div>


    <div class="tabs">

        <button
            id="premiumTab"
            class="tab active"
        >
            Premium
        </button>


        <button
            id="crackedTab"
            class="tab"
        >
            Cracked
        </button>

    </div>


    <div
        id="gamemodes"
        class="gamemodes"
    ></div>


    <div
        id="live"
        class="live"
    >
        ● LIVE DATABASE
    </div>


    <div
        id="loading"
        class="loading"
    >
        Loading leaderboard...
    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="content"
        style="display:none;"
    >

        <div
            id="podium"
            class="podium"
        ></div>


        <div
            id="leaderboardList"
            class="leaderboard-list"
        ></div>

    </div>


</div>


<script type="module">

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
    app
} from "./firebase.js";


const database =
    getDatabase(app);


const premiumTab =
    document.getElementById(
        "premiumTab"
    );


const crackedTab =
    document.getElementById(
        "crackedTab"
    );


const gamemodes =
    document.getElementById(
        "gamemodes"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const content =
    document.getElementById(
        "content"
    );


const podium =
    document.getElementById(
        "podium"
    );


const leaderboardList =
    document.getElementById(
        "leaderboardList"
    );


let allPlayers = {};

let accountMode =
    "premium";

let selectedGamemode =
    "sword";


/*
    GAMEMODES
*/

const modeNames = {

    vanilla: "Vanilla",
    sword: "Sword",
    axe: "Axe",
    uhc: "UHC",
    pot: "Pot",
    mace: "Mace",
    smp: "SMP",
    crystal: "Crystal"

};


/*
    TIER ORDER
*/

const tierOrder = {

    HT1: 10,
    LT1: 9,

    HT2: 8,
    LT2: 7,

    HT3: 6,
    LT3: 5,

    HT4: 4,
    LT4: 3,

    HT5: 2,
    LT5: 1

};


/*
    CREATE GAMEMODE BUTTONS
*/

Object.entries(
    modeNames
).forEach(
    ([key, name]) => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "mode";


        if (
            key ===
            selectedGamemode
        ) {

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            name;


        button.dataset.mode =
            key;


        button.addEventListener(
            "click",
            () => {

                selectedGamemode =
                    key;


                document
                    .querySelectorAll(
                        ".mode"
                    )
                    .forEach(
                        element =>
                            element.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                renderLeaderboard();

            }
        );


        gamemodes.appendChild(
            button
        );

    }
);


/*
    ACCOUNT TABS
*/

premiumTab.addEventListener(
    "click",
    () => {

        accountMode =
            "premium";


        premiumTab.classList.add(
            "active"
        );


        crackedTab.classList.remove(
            "active"
        );


        renderLeaderboard();

    }
);


crackedTab.addEventListener(
    "click",
    () => {

        accountMode =
            "cracked";


        crackedTab.classList.add(
            "active"
        );


        premiumTab.classList.remove(
            "active"
        );


        renderLeaderboard();

    }
);


/*
    TIER SCORE
*/

function getTierScore(tier) {

    return tierOrder[tier] || 0;

}


/*
    GET PLAYERS
*/

function getRankedPlayers() {

    const players = [];


    Object.entries(
        allPlayers
    ).forEach(
        ([uid, player]) => {

            if (!player) {
                return;
            }


            /*
                ACCOUNT TYPE
            */

            if (
                accountMode ===
                "premium"
            ) {

                if (
                    player.accountType !==
                    "premium"
                ) {

                    return;

                }

            }

            else {

                if (
                    player.accountType !==
                    "cracked"
                ) {

                    return;

                }

            }


            const tier =
                player.tiers?.[
                    selectedGamemode
                ] ||
                "Unranked";


            /*
                UNRANKED PLAYERS
                DO NOT ENTER LEADERBOARD
            */

            if (
                !tierOrder[tier]
            ) {

                return;

            }


            players.push({

                uid: uid,

                player: player,

                tier: tier,

                score:
                    getTierScore(
                        tier
                    )

            });

        }
    );


    /*
        SORT BEST -> WORST
    */

    players.sort(
        (a, b) => {

            if (
                b.score !==
                a.score
            ) {

                return (
                    b.score -
                    a.score
                );

            }


            const aTests =
                a.player.stats?.tests ||
                0;


            const bTests =
                b.player.stats?.tests ||
                0;


            return (
                bTests -
                aTests
            );

        }
    );


    return players;

}


/*
    SKIN
*/

function getSkinURL(player) {

    if (player.uuid) {

        return `https://mc-heads.net/body/${player.uuid}/180`;

    }


    return `https://mc-heads.net/body/${encodeURIComponent(
        player.minecraftName
    )}/180`;

}


/*
    ESCAPE
*/

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
    RENDER PODIUM
*/

function renderPodium(players) {

    podium.innerHTML = "";


    const topPlayers =
        players.slice(
            0,
            3
        );


    const positions = [

        {
            place: 2,
            className: "second",
            label: "TOP 2"
        },

        {
            place: 1,
            className: "first",
            label: "TOP 1"
        },

        {
            place: 3,
            className: "third",
            label: "TOP 3"
        }

    ];


    positions.forEach(
        position => {

            const entry =
                topPlayers[
                    position.place - 1
                ];


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                `podium-card ${position.className}`;


            if (!entry) {

                card.innerHTML = `

                    <div class="position">
                        ${position.label}
                    </div>

                    <div class="podium-skin">
                    </div>

                    <div class="podium-name">
                        Unranked
                    </div>

                    <div class="podium-tier">
                        -
                    </div>

                `;


                podium.appendChild(
                    card
                );


                return;

            }


            const player =
                entry.player;


            card.innerHTML = `

                <div class="position">
                    ${position.label}
                </div>

                <div class="podium-skin">

                    <img
                        src="${getSkinURL(player)}"
                        alt=""
                    >

                </div>

                <div class="podium-name">

                    ${escapeHTML(
                        player.minecraftName ||
                        "Unknown"
                    )}

                </div>

                <div class="podium-tier">

                    ${entry.tier}

                </div>

                <div class="podium-region">

                    🌍 ${
                        escapeHTML(
                            player.region ||
                            "EU"
                        )
                    }

                </div>

            `;


            podium.appendChild(
                card
            );

        }
    );

}


/*
    RENDER LIST
*/

function renderList(players) {

    leaderboardList.innerHTML = "";


    const remaining =
        players.slice(
            3,
            50
        );


    remaining.forEach(
        (entry, index) => {

            const position =
                index + 4;


            const player =
                entry.player;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "player-row";


            const accountClass =
                player.accountType ===
                "cracked"
                    ? "cracked"
                    : "";


            const accountText =
                player.accountType ===
                "cracked"
                    ? "CRACKED"
                    : "PREMIUM";


            row.innerHTML = `

                <div class="rank">
                    #${position}
                </div>


                <div class="row-skin">

                    <img
                        src="${getSkinURL(player)}"
                        alt=""
                    >

                </div>


                <div class="player-info">

                    <div class="player-name">

                        ${escapeHTML(
                            player.minecraftName ||
                            "Unknown"
                        )}

                    </div>


                    <div class="player-region">

                        🌍 ${
                            escapeHTML(
                                player.region ||
                                "EU"
                            )
                        }

                        &nbsp; • &nbsp;

                        <span class="account ${accountClass}">
                            ${accountText}
                        </span>

                    </div>

                </div>


                <div class="tier-box">

                    <div class="tier-icon">
                        ⚔
                    </div>

                    <div class="tier">
                        ${entry.tier}
                    </div>

                </div>


                <div class="count">

                    ${
                        player.stats?.tests ||
                        0
                    }
                    tests

                </div>

            `;


            leaderboardList.appendChild(
                row
            );

        }
    );

}


/*
    RENDER EVERYTHING
*/

function renderLeaderboard() {

    const players =
        getRankedPlayers();


    if (!players.length) {

        podium.innerHTML = "";


        leaderboardList.innerHTML = `

            <div class="empty">

                No ranked players found for
                <strong>
                    ${modeNames[selectedGamemode]}
                </strong>.

            </div>

        `;


        content.style.display =
            "block";


        return;

    }


    renderPodium(
        players
    );


    renderList(
        players
    );


    content.style.display =
        "block";

}


/*
    FIREBASE LIVE DATABASE
*/

onValue(

    ref(
        database,
        "players"
    ),

    (snapshot) => {

        loading.style.display =
            "none";


        errorBox.style.display =
            "none";


        allPlayers =
            snapshot.exists()
                ? snapshot.val()
                : {};


        renderLeaderboard();

    },

    (error) => {

        console.error(
            "Leaderboard Firebase error:",
            error
        );


        loading.style.display =
            "none";


        content.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Could not load leaderboard: " +
            error.message;

    }

);


/*
    OPEN CRACKED TAB
    IF URL HAS #cracked
*/

if (
    window.location.hash
        .toLowerCase() ===
    "#cracked"
) {

    accountMode =
        "cracked";


    premiumTab.classList.remove(
        "active"
    );


    crackedTab.classList.add(
        "active"
    );

}

</script>


<script
    type="module"
    src="./auth-ui.js"
></script>


</body>

</html>
