<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Players | RO TierList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(124,92,255,0.16),
                    transparent 35%
                ),
                #08080d;

            color: white;

            padding: 120px 20px 60px;

        }


        .container {

            width: 100%;
            max-width: 1100px;

            margin: auto;

        }


        .top {

            text-align: center;

            margin-bottom: 35px;

        }


        .top h1 {

            font-size: 42px;

            font-weight: 900;

            margin-bottom: 10px;

        }


        .top p {

            color: #777783;

            font-size: 14px;

        }


        .search-box {

            display: flex;

            max-width: 650px;

            margin: 0 auto 35px;

            gap: 10px;

        }


        .search-input {

            flex: 1;

            padding: 16px 18px;

            border-radius: 13px;

            border:
                1px solid rgba(255,255,255,0.08);

            background: #111119;

            color: white;

            outline: none;

            font-size: 14px;

        }


        .search-input:focus {

            border-color: #7c5cff;

        }


        .search-button {

            padding: 0 25px;

            border: none;

            border-radius: 13px;

            background: #7c5cff;

            color: white;

            font-weight: 900;

            cursor: pointer;

            transition: 0.2s;

        }


        .search-button:hover {

            transform: translateY(-1px);

            opacity: 0.9;

        }


        .status {

            text-align: center;

            color: #777783;

            padding: 35px;

            display: none;

        }


        .error {

            text-align: center;

            color: #ff6b6b;

            padding: 35px;

            display: none;

        }


        .results {

            display: none;

        }


        .player-card {

            display: grid;

            grid-template-columns: 110px 1fr auto;

            align-items: center;

            gap: 25px;

            padding: 25px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 20px;

            transition: 0.2s;

        }


        .player-card:hover {

            border-color:
                rgba(124,92,255,0.30);

            transform: translateY(-2px);

        }


        .skin-box {

            height: 130px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            overflow: hidden;

        }


        .skin {

            height: 130px;

            max-width: 100px;

            image-rendering: pixelated;

        }


        .player-name {

            font-size: 27px;

            font-weight: 900;

            margin-bottom: 10px;

        }


        .badges {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 12px;

        }


        .badge {

            padding: 6px 10px;

            border-radius: 8px;

            background: #171720;

            border:
                1px solid rgba(255,255,255,0.07);

            color: #aaaab6;

            font-size: 11px;

            font-weight: 800;

        }


        .badge.premium {

            color: #65e6a0;

            background:
                rgba(50,220,130,0.08);

            border-color:
                rgba(50,220,130,0.16);

        }


        .badge.cracked {

            color: #ffc85a;

            background:
                rgba(255,190,60,0.08);

            border-color:
                rgba(255,190,60,0.16);

        }


        .badge.ranked {

            color: #b99cff;

            background:
                rgba(124,92,255,0.10);

            border-color:
                rgba(124,92,255,0.20);

        }


        .details {

            color: #656572;

            font-size: 11px;

        }


        .view-button {

            padding: 12px 17px;

            border-radius: 11px;

            border:
                1px solid rgba(124,92,255,0.25);

            background:
                rgba(124,92,255,0.10);

            color: #b99cff;

            font-weight: 800;

            text-decoration: none;

            transition: 0.2s;

            white-space: nowrap;

        }


        .view-button:hover {

            background:
                rgba(124,92,255,0.18);

        }


        .tiers {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 25px;

        }


        .tier-card {

            padding: 15px;

            background: #101017;

            border:
                1px solid rgba(255,255,255,0.06);

            border-radius: 12px;

        }


        .tier-name {

            color: #6e6e7a;

            font-size: 10px;

            margin-bottom: 6px;

        }


        .tier-value {

            font-size: 17px;

            font-weight: 900;

        }


        .tier-value.ranked {

            color: white;

        }


        .no-result {

            text-align: center;

            padding: 70px 20px;

            background:
                rgba(15,15,23,0.92);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 20px;

        }


        .no-result-title {

            font-size: 22px;

            font-weight: 900;

            margin-bottom: 8px;

        }


        .no-result-text {

            color: #70707d;

            font-size: 13px;

        }


        @media (max-width: 750px) {

            .player-card {

                grid-template-columns: 1fr;

                text-align: center;

            }


            .badges {

                justify-content: center;

            }


            .details {

                text-align: center;

            }


            .view-button {

                display: inline-block;

            }


            .tiers {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 500px) {

            body {

                padding-left: 12px;

                padding-right: 12px;

            }


            .top h1 {

                font-size: 32px;

            }


            .search-box {

                flex-direction: column;

            }


            .search-button {

                padding: 14px;

            }


            .tiers {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="top">

        <h1>
            Players
        </h1>

        <p>
            Search for a Minecraft player and view their RO TierList profile.
        </p>

    </div>


    <div class="search-box">

        <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Enter Minecraft username..."
            maxlength="16"
            autocomplete="off"
        >

        <button
            id="searchButton"
            class="search-button"
        >
            Search
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        Searching...
    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="results"
        class="results"
    ></div>


</div>


<script type="module">

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
    app
} from "./firebase.js";


const database =
    getDatabase(app);


const searchInput =
    document.getElementById("searchInput");


const searchButton =
    document.getElementById("searchButton");


const status =
    document.getElementById("status");


const errorBox =
    document.getElementById("error");


const results =
    document.getElementById("results");


const modeNames = {

    vanilla: "Vanilla",
    sword: "Sword",
    axe: "Axe",
    uhc: "UHC",
    pot: "Pot",
    mace: "Mace",
    smp: "SMP",
    crystal: "Crystal"

};


/*
    TIER ORDER
*/

const tierOrder = {

    HT1: 10,
    LT1: 9,

    HT2: 8,
    LT2: 7,

    HT3: 6,
    LT3: 5,

    HT4: 4,
    LT4: 3,

    HT5: 2,
    LT5: 1

};


/*
    GET OVERALL TIER
*/

function getOverallTier(tiers) {

    const ranked =
        Object.values(
            tiers || {}
        ).filter(
            tier =>
                tierOrder[tier]
        );


    if (!ranked.length) {

        return "Unranked";

    }


    ranked.sort(
        (a, b) =>
            tierOrder[b] -
            tierOrder[a]
    );


    return ranked[0];

}


/*
    GET RANKED COUNT
*/

function getRankedCount(tiers) {

    return Object.values(
        tiers || {}
    ).filter(
        tier =>
            tier &&
            tier !== "Unranked"
    ).length;

}


/*
    SEARCH FIREBASE
*/

async function searchPlayer(username) {

    const normalized =
        username
            .trim()
            .toLowerCase();


    if (!normalized) {

        showError(
            "Enter a Minecraft username."
        );

        return;

    }


    if (
        !/^[a-zA-Z0-9_]{3,16}$/.test(
            normalized
        )
    ) {

        showError(
            "Invalid Minecraft username."
        );

        return;

    }


    status.style.display =
        "block";

    errorBox.style.display =
        "none";

    results.style.display =
        "none";


    try {

        const snapshot =
            await get(
                ref(
                    database,
                    "players"
                )
            );


        if (!snapshot.exists()) {

            showNoResult();

            return;

        }


        const players =
            snapshot.val();


        let foundPlayer = null;


        let foundUID = null;


        /*
            FIND PLAYER BY MINECRAFT NAME
        */

        for (
            const uid in players
        ) {

            const player =
                players[uid];


            if (
                player &&
                player.minecraftName &&
                player.minecraftName
                    .toLowerCase() ===
                    normalized
            ) {

                foundPlayer =
                    player;

                foundUID =
                    uid;

                break;

            }

        }


        status.style.display =
            "none";


        if (!foundPlayer) {

            showNoResult();

            return;

        }


        renderPlayer(
            foundPlayer,
            foundUID
        );

    }


    catch (err) {

        console.error(
            "Player search error:",
            err
        );


        status.style.display =
            "none";


        showError(
            "Could not search players: " +
            (
                err.message ||
                "Unknown error"
            )
        );

    }

}


/*
    RENDER PLAYER
*/

function renderPlayer(
    player,
    uid
) {

    results.innerHTML = "";


    const tiers =
        player.tiers || {};


    const overall =
        getOverallTier(
            tiers
        );


    const rankedCount =
        getRankedCount(
            tiers
        );


    let accountBadge = "";


    if (
        player.accountType ===
        "premium"
    ) {

        accountBadge = `
            <div class="badge premium">
                ✓ Premium
            </div>
        `;

    }

    else if (
        player.accountType ===
        "cracked"
    ) {

        accountBadge = `
            <div class="badge cracked">
                ⚠ Cracked
            </div>
        `;

    }

    else {

        accountBadge = `
            <div class="badge">
                ⚠ Unverified
            </div>
        `;

    }


    const rankedBadge =
        rankedCount > 0
            ? `
                <div class="badge ranked">
                    ✓ Ranked
                </div>
              `
            : `
                <div class="badge">
                    Unranked
                </div>
              `;


    let skinURL = "";


    if (player.uuid) {

        skinURL =
            `https://mc-heads.net/body/${player.uuid}/180`;

    }

    else {

        skinURL =
            `https://mc-heads.net/body/${encodeURIComponent(
                player.minecraftName
            )}/180`;

    }


    const server =
        player.accountType === "premium"
            ? "MCPVP.CLUB"
            : player.accountType === "cracked"
                ? "CRAFTIFY.LOL"
                : "Not tested";


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "player-card";


    card.innerHTML = `

        <div class="skin-box">

            <img
                class="skin"
                src="${skinURL}"
                alt="Minecraft Skin"
            >

        </div>


        <div>

            <div class="player-name">
                ${escapeHTML(
                    player.minecraftName ||
                    "Unknown"
                )}
            </div>


            <div class="badges">

                ${accountBadge}

                <div class="badge">
                    🌍 ${escapeHTML(
                        player.region ||
                        "EU"
                    )}
                </div>

                ${rankedBadge}

            </div>


            <div class="details">

                Overall:
                <strong>
                    ${overall}
                </strong>

                &nbsp; • &nbsp;

                ${rankedCount}/8 gamemodes

                &nbsp; • &nbsp;

                ${player.stats?.tests || 0}
                tests

                &nbsp; • &nbsp;

                ${server}

            </div>


            <div class="tiers">

                ${Object.entries(
                    modeNames
                ).map(
                    ([key, name]) => {

                        const tier =
                            tiers[key] ||
                            "Unranked";


                        return `

                            <div class="tier-card">

                                <div class="tier-name">
                                    ${name}
                                </div>

                                <div class="tier-value ${
                                    tier !== "Unranked"
                                        ? "ranked"
                                        : ""
                                }">

                                    ${tier}

                                </div>

                            </div>

                        `;

                    }
                ).join("")}

            </div>

        </div>


        <div>

            <a
                class="view-button"
                href="profile.html"
            >
                View Profile
            </a>

        </div>

    `;


    /*
        VIEW PROFILE
        Own profile for now.
    */

    const viewButton =
        card.querySelector(
            ".view-button"
        );


    viewButton.addEventListener(
        "click",
        (event) => {

            event.preventDefault();


            window.location.href =
                `players.html?player=${encodeURIComponent(
                    player.minecraftName
                )}`;

        }
    );


    results.appendChild(
        card
    );


    results.style.display =
        "block";

}


/*
    NO RESULT
*/

function showNoResult() {

    status.style.display =
        "none";


    results.style.display =
        "block";


    results.innerHTML = `

        <div class="no-result">

            <div class="no-result-title">
                Player not found
            </div>

            <div class="no-result-text">
                This player does not have a profile on RO TierList yet.
            </div>

        </div>

    `;

}


/*
    ERROR
*/

function showError(message) {

    status.style.display =
        "none";


    results.style.display =
        "none";


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";

}


/*
    HTML ESCAPE
*/

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
    SEARCH BUTTON
*/

searchButton.addEventListener(
    "click",
    () => {

        searchPlayer(
            searchInput.value
        );

    }
);


/*
    ENTER
*/

searchInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key ===
            "Enter"
        ) {

            searchPlayer(
                searchInput.value
            );

        }

    }
);


/*
    URL SEARCH
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const urlPlayer =
    params.get(
        "player"
    );


if (urlPlayer) {

    searchInput.value =
        urlPlayer;


    searchPlayer(
        urlPlayer
    );

}

</script>


<script
    type="module"
    src="./auth-ui.js"
></script>


</body>

</html>
