<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RO TierList</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #172033 0%, #080b12 45%, #05070b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-box {
            width: 420px;
            max-width: 92%;
            padding: 34px;
            background: rgba(15, 20, 32, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.45);
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .subtitle {
            text-align: center;
            color: #8e98aa;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #d7dbe4;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 17px;
            border-radius: 10px;
            border: 1px solid #252c3b;
            background: #0b0f18;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 3px 0 20px;
            color: #8992a3;
            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            width: auto;
            margin: 3px 0 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6d3ee8);
            color: white;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(139,92,246,0.25);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #ff8b8b;
        }

        .success {
            display: block;
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.25);
            color: #75e69b;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #8992a3;
            font-size: 13px;
        }

        .login a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #697386;
            font-size: 12px;
            text-decoration: none;
        }

        .back:hover,
        .login a:hover {
            color: #c4b5fd;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">
        RO <span>TierList</span>
    </div>

    <div class="subtitle">
        Create your Minecraft PvP account
    </div>

    <form id="registerForm">

        <label for="minecraftName">Minecraft Name</label>
        <input
            id="minecraftName"
            type="text"
            placeholder="e.g. Steve"
            maxlength="16"
            autocomplete="off"
            required
        >

        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            id="confirmPassword"
            type="password"
            placeholder="Repeat your password"
            autocomplete="new-password"
            required
        >

        <label class="terms">
            <input id="terms" type="checkbox" required>
            <span>
                I agree to the RO TierList rules and understand that
                fake information or cheating in tests can result in a blacklist.
            </span>
        </label>

        <button id="registerButton" type="submit">
            CREATE ACCOUNT
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
        ← Back to website
    </a>

</div>

<script type="module">

    import {
        createUserWithEmailAndPassword,
        sendEmailVerification,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "./firebase.js";

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const minecraftName =
            document.getElementById("minecraftName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const terms =
            document.getElementById("terms").checked;

        message.className = "message";
        message.textContent = "";

        if (minecraftName.length < 3) {
            showMessage("Minecraft Name must have at least 3 characters.", "error");
            return;
        }

        if (minecraftName.length > 16) {
            showMessage("Minecraft Name is too long.", "error");
            return;
        }

        if (!/^[A-Za-z0-9_]+$/.test(minecraftName)) {
            showMessage(
                "Minecraft Name can only contain letters, numbers and underscores.",
                "error"
            );
            return;
        }

        if (password.length < 6) {
            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage(
                "Passwords do not match.",
                "error"
            );
            return;
        }

        if (!terms) {
            showMessage(
                "You must accept the rules.",
                "error"
            );
            return;
        }

        button.disabled = true;
        button.textContent = "CREATING ACCOUNT...";

        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user = userCredential.user;

            /*
             * We store the Minecraft name inside
             * Firebase Authentication as displayName.
             */
            await updateProfile(user, {
                displayName: minecraftName
            });

            /*
             * Send verification email.
             */
            await sendEmailVerification(user);

            showMessage(
                "Account created! Check your email and verify your account before logging in.",
                "success"
            );

            button.textContent = "ACCOUNT CREATED";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 3000);

        } catch (error) {

            console.error(error);

            let errorMessage =
                "Something went wrong. Please try again.";

            if (error.code === "auth/email-already-in-use") {
                errorMessage =
                    "This email is already registered.";
            }

            else if (error.code === "auth/invalid-email") {
                errorMessage =
                    "Please enter a valid email address.";
            }

            else if (error.code === "auth/weak-password") {
                errorMessage =
                    "Password is too weak.";
            }

            else if (error.code === "auth/operation-not-allowed") {
                errorMessage =
                    "Email/Password authentication is not enabled in Firebase.";
            }

            showMessage(errorMessage, "error");

            button.disabled = false;
            button.textContent = "CREATE ACCOUNT";
        }
    });

</script>

</body>
</html>
