<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RO TierList</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.14), transparent 35%),
                #07070b;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            height: 72px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.07);
            background: rgba(7,7,11,.78);
            backdrop-filter: blur(15px);
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-size: 21px;
            font-weight: 800;
        }

        .logo span {
            color: #8b5cf6;
        }

        .nav-links {
            display: flex;
            gap: 26px;
            align-items: center;
        }

        .nav-links a {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: .2s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-register {
            color: #fff !important;
            padding: 10px 17px;
            border-radius: 9px;
            background: rgba(139,92,246,.15);
            border: 1px solid rgba(139,92,246,.3);
        }

        main {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
            padding: 38px;
            border-radius: 18px;
            background: rgba(15,15,22,.9);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow:
                0 25px 80px rgba(0,0,0,.45),
                0 0 50px rgba(139,92,246,.08);
        }

        .icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: rgba(139,92,246,.13);
            border: 1px solid rgba(139,92,246,.25);
            font-size: 24px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #bbb;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.09);
            outline: none;
            background: #0b0b10;
            color: #fff;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: rgba(139,92,246,.65);
            box-shadow: 0 0 0 3px rgba(139,92,246,.08);
        }

        input::placeholder {
            color: #555;
        }

        .password-info {
            color: #666;
            font-size: 11px;
            margin-top: 7px;
        }

        .terms {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            margin: 20px 0;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            width: 15px;
            height: 15px;
            margin-top: 2px;
            accent-color: #8b5cf6;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            color: #ff8d8d;
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.2);
        }

        .message.success {
            display: block;
            color: #9df5bb;
            background: rgba(34,197,94,.08);
            border: 1px solid rgba(34,197,94,.2);
        }

        .login {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,.07);
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        .login a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 850px) {
            .nav-links {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">
        RO<span>TierList</span>
    </a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="players.html">Players</a>
        <a href="leaderboards.html">Leaderboards</a>
        <a href="results.html">Results</a>
        <a href="tiers.html">Tiers</a>
        <a href="https://discord.gg/bms3jPBD9p" target="_blank">Discord</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="nav-register">Register</a>
    </div>
</nav>

<main>

    <div class="register-box">

        <div class="icon">✦</div>

        <h1>Create account</h1>

        <p class="subtitle">
            Join the RO TierList community
        </p>

        <form id="registerForm">

            <div class="input-group">
                <label for="minecraftName">Minecraft Name</label>

                <input
                    type="text"
                    id="minecraftName"
                    placeholder="Your Minecraft username"
                    maxlength="16"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <div class="password-info">
                    Minimum 6 characters
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                    minlength="6"
                    required
                >
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>

                <span>
                    I agree to the RO TierList rules and understand that
                    tier results are based on official testing.
                </span>
            </label>

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</main>

<script type="module">

    import {
        createUserWithEmailAndPassword,
        sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
        auth,
        db
    } from "./firebase.js";


    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");


    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }


    registerForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const minecraftName =
            document.getElementById("minecraftName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const terms =
            document.getElementById("terms").checked;


        if (!minecraftName || !email || !password || !confirmPassword) {
            showMessage(
                "Completeaza toate campurile.",
                "error"
            );
            return;
        }


        if (!/^[a-zA-Z0-9_]+$/.test(minecraftName)) {
            showMessage(
                "Numele Minecraft poate contine doar litere, cifre si _. ",
                "error"
            );
            return;
        }


        if (minecraftName.length < 3) {
            showMessage(
                "Numele Minecraft trebuie sa aiba cel putin 3 caractere.",
                "error"
            );
            return;
        }


        if (password.length < 6) {
            showMessage(
                "Parola trebuie sa aiba cel putin 6 caractere.",
                "error"
            );
            return;
        }


        if (password !== confirmPassword) {
            showMessage(
                "Parolele nu coincid.",
                "error"
            );
            return;
        }


        if (!terms) {
            showMessage(
                "Trebuie sa accepti regulile.",
                "error"
            );
            return;
        }


        registerButton.disabled = true;
        registerButton.textContent = "Creating account...";


        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user = userCredential.user;


            /*
                Salvam datele publice ale contului
                in Firestore.
            */

            await setDoc(
                doc(db, "users", user.uid),
                {
                    minecraftName: minecraftName,
                    email: email,

                    region: "EU",

                    accountType: "Unranked",

                    tiers: {
                        vanilla: "Unranked",
                        sword: "Unranked",
                        axe: "Unranked",
                        uhc: "Unranked",
                        pot: "Unranked",
                        mace: "Unranked",
                        smp: "Unranked",
                        crystal: "Unranked"
                    },

                    tests: 0,

                    createdAt: serverTimestamp()
                }
            );


            /*
                Trimitem email-ul de verificare.
            */

            await sendEmailVerification(user);


            showMessage(
                "Cont creat! Verifica-ti email-ul pentru a continua.",
                "success"
            );


            registerButton.textContent = "Account Created";


            setTimeout(() => {
                window.location.href = "login.html";
            }, 2500);


        } catch (error) {

            console.error(error);

            let errorMessage =
                "A aparut o eroare. Incearca din nou.";

            if (error.code === "auth/email-already-in-use") {
                errorMessage =
                    "Acest email este deja folosit.";
            }

            else if (error.code === "auth/invalid-email") {
                errorMessage =
                    "Email invalid.";
            }

            else if (error.code === "auth/weak-password") {
                errorMessage =
                    "Parola este prea slaba.";
            }

            else if (error.code === "auth/network-request-failed") {
                errorMessage =
                    "Eroare de conexiune. Verifica internetul.";
            }

            showMessage(
                errorMessage,
                "error"
            );

            registerButton.disabled = false;
            registerButton.textContent = "Create Account";
        }

    });

</script>

</body>
</html>
