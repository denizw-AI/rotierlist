<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RO TierList</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(90, 70, 255, 0.16), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 200, 255, 0.10), transparent 35%),
                #08080d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-box {
            width: 100%;
            max-width: 470px;
            padding: 35px;
            background: rgba(15, 15, 23, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.55);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .logo span {
            color: #7c5cff;
        }

        .subtitle {
            text-align: center;
            color: #8e8e9e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d8d8e2;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.08);
            outline: none;
            background: #101018;
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }

        select {
            cursor: pointer;
        }

        input:focus,
        select:focus {
            border-color: #7c5cff;
            box-shadow: 0 0 0 3px rgba(124,92,255,0.10);
        }

        .minecraft-row {
            display: flex;
            gap: 10px;
        }

        .minecraft-row input {
            flex: 1;
        }

        .check-btn {
            height: 48px;
            padding: 0 16px;
            border: none;
            border-radius: 11px;
            background: #191923;
            color: white;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.2s;
            white-space: nowrap;
        }

        .check-btn:hover {
            background: #242432;
            border-color: rgba(124,92,255,0.5);
        }

        .check-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .minecraft-status {
            display: none;
            margin-top: 9px;
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 12px;
            line-height: 1.5;
        }

        .minecraft-status.premium {
            display: block;
            background: rgba(50, 220, 130, 0.08);
            border: 1px solid rgba(50, 220, 130, 0.18);
            color: #65e6a0;
        }

        .minecraft-status.unknown {
            display: block;
            background: rgba(255, 190, 60, 0.08);
            border: 1px solid rgba(255, 190, 60, 0.18);
            color: #ffc85a;
        }

        .minecraft-status.error {
            display: block;
            background: rgba(255, 70, 90, 0.08);
            border: 1px solid rgba(255, 70, 90, 0.18);
            color: #ff7888;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 5px 0 20px;
            color: #92929f;
            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            width: 16px;
            height: 16px;
            margin-top: 1px;
            accent-color: #7c5cff;
        }

        .terms a {
            color: #9b85ff;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c5cff, #5f43db);
            color: white;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 10px 30px rgba(124,92,255,0.20);
        }

        .register-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 35px rgba(124,92,255,0.28);
        }

        .register-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #858592;
            font-size: 13px;
        }

        .login-link a {
            color: #9b85ff;
            text-decoration: none;
            font-weight: 800;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: rgba(255,70,90,0.08);
            border: 1px solid rgba(255,70,90,0.18);
            color: #ff7c8a;
        }

        .message.success {
            display: block;
            background: rgba(50,220,130,0.08);
            border: 1px solid rgba(50,220,130,0.18);
            color: #65e6a0;
        }

        .region-info {
            margin-top: 7px;
            color: #666673;
            font-size: 11px;
        }

        @media (max-width: 500px) {
            .register-box {
                padding: 25px 20px;
            }

            .minecraft-row {
                flex-direction: column;
            }

            .check-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">
        RO <span>TierList</span>
    </div>

    <div class="subtitle">
        Create your player account
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm">

        <!-- Minecraft -->
        <div class="field">
            <label>Minecraft Name</label>

            <div class="minecraft-row">
                <input
                    type="text"
                    id="minecraftName"
                    placeholder="Ex: Smituureal"
                    maxlength="16"
                    autocomplete="off"
                    required
                >

                <button
                    type="button"
                    class="check-btn"
                    id="checkMinecraft"
                >
                    Check
                </button>
            </div>

            <div id="minecraftStatus" class="minecraft-status"></div>
        </div>

        <!-- Region -->
        <div class="field">
            <label>Region</label>

            <select id="region" required>
                <option value="">Select your region</option>
                <option value="EU">🇪🇺 Europe</option>
                <option value="NA">🇺🇸 North America</option>
                <option value="AS">🌏 Asia</option>
                <option value="SA">🌎 South America</option>
                <option value="AU">🇦🇺 Oceania</option>
            </select>

            <div class="region-info">
                Your region will be displayed on your profile and leaderboard.
            </div>
        </div>

        <!-- Email -->
        <div class="field">
            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>

        <!-- Password -->
        <div class="field">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >
        </div>

        <!-- Confirm -->
        <div class="field">
            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Repeat your password"
                autocomplete="new-password"
                required
            >
        </div>

        <!-- Terms -->
        <div class="terms">
            <input
                type="checkbox"
                id="terms"
                required
            >

            <div>
                I agree to the
                <a href="#">Terms of Service</a>
                and
                <a href="#">Privacy Policy</a>.
            </div>
        </div>

        <button
            type="submit"
            class="register-btn"
            id="registerBtn"
        >
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script type="module">

    import {
        createUserWithEmailAndPassword,
        sendEmailVerification,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "./firebase.js";


    /*
     * CLOUDFLARE WORKER
     */

    const WORKER_URL =
        "https://rotierlist-minecraft.denizzzezw.workers.dev";


    /*
     * ELEMENTS
     */

    const form = document.getElementById("registerForm");

    const minecraftNameInput =
        document.getElementById("minecraftName");

    const regionInput =
        document.getElementById("region");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const termsInput =
        document.getElementById("terms");

    const checkMinecraftButton =
        document.getElementById("checkMinecraft");

    const registerButton =
        document.getElementById("registerBtn");

    const minecraftStatus =
        document.getElementById("minecraftStatus");

    const message =
        document.getElementById("message");


    /*
     * TEMPORARY PROFILE DATA
     */

    let minecraftData = null;


    /*
     * SHOW MESSAGE
     */

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    /*
     * MINECRAFT USERNAME VALIDATION
     */

    function validMinecraftName(name) {

        return /^[A-Za-z0-9_]{3,16}$/.test(name);
    }


    /*
     * CHECK MINECRAFT ACCOUNT
     */

    async function checkMinecraft() {

        const username =
            minecraftNameInput.value.trim();

        if (!validMinecraftName(username)) {

            minecraftStatus.className =
                "minecraft-status error";

            minecraftStatus.textContent =
                "Invalid Minecraft username. Use 3-16 letters, numbers or _. ";

            minecraftData = null;

            return;
        }


        checkMinecraftButton.disabled = true;

        checkMinecraftButton.textContent =
            "Checking...";


        minecraftStatus.className =
            "minecraft-status premium";

        minecraftStatus.textContent =
            "Checking Minecraft account...";


        try {

            const response = await fetch(
                `${WORKER_URL}/?username=${encodeURIComponent(username)}`
            );


            if (!response.ok) {
                throw new Error("Worker request failed");
            }


            const data =
                await response.json();


            /*
             * PREMIUM
             */

            if (
                data.success &&
                data.accountType === "premium" &&
                data.uuid
            ) {

                minecraftData = {

                    username:
                        data.username || username,

                    uuid:
                        data.uuid,

                    accountType:
                        "premium"

                };


                minecraftStatus.className =
                    "minecraft-status premium";


                minecraftStatus.innerHTML =
                    "✓ <strong>Premium account detected</strong><br>" +
                    "Username: " +
                    escapeHtml(data.username || username) +
                    "<br>" +
                    "UUID: " +
                    escapeHtml(data.uuid);

            }


            /*
             * UNKNOWN
             */

            else if (
                data.success &&
                data.accountType === "unknown"
            ) {

                minecraftData = {

                    username:
                        username,

                    uuid:
                        null,

                    accountType:
                        "unknown"

                };


                minecraftStatus.className =
                    "minecraft-status unknown";


                minecraftStatus.innerHTML =
                    "⚠ <strong>Premium account could not be verified.</strong><br>" +
                    "You can continue, but your account will remain unverified until we can confirm it.";
            }


            /*
             * ERROR
             */

            else {

                minecraftData = null;

                minecraftStatus.className =
                    "minecraft-status error";


                minecraftStatus.textContent =
                    "Minecraft account could not be checked.";
            }

        }

        catch (error) {

            console.error(error);

            minecraftData = null;

            minecraftStatus.className =
                "minecraft-status error";


            minecraftStatus.textContent =
                "Could not connect to the Minecraft verification service.";
        }


        checkMinecraftButton.disabled = false;

        checkMinecraftButton.textContent =
            "Check";
    }


    /*
     * ESCAPE HTML
     */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /*
     * CHECK BUTTON
     */

    checkMinecraftButton.addEventListener(
        "click",
        checkMinecraft
    );


    /*
     * RECHECK WHEN USER CHANGES NAME
     */

    minecraftNameInput.addEventListener(
        "input",
        () => {

            minecraftData = null;

            minecraftStatus.className =
                "minecraft-status";

            minecraftStatus.textContent =
                "";
        }
    );


    /*
     * REGISTER
     */

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const minecraftName =
                minecraftNameInput.value.trim();

            const region =
                regionInput.value;

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            /*
             * VALIDATION
             */

            if (!validMinecraftName(minecraftName)) {

                showMessage(
                    "Please enter a valid Minecraft username.",
                    "error"
                );

                return;
            }


            if (!region) {

                showMessage(
                    "Please select your region.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            if (!termsInput.checked) {

                showMessage(
                    "You must accept the Terms of Service.",
                    "error"
                );

                return;
            }


            /*
             * AUTOMATIC MINECRAFT CHECK
             */

            if (
                !minecraftData ||
                minecraftData.username.toLowerCase() !==
                minecraftName.toLowerCase()
            ) {

                await checkMinecraft();


                if (!minecraftData) {

                    showMessage(
                        "Please verify your Minecraft username first.",
                        "error"
                    );

                    return;
                }
            }


            /*
             * DISABLE BUTTON
             */

            registerButton.disabled = true;

            registerButton.textContent =
                "Creating Account...";


            try {

                /*
                 * CREATE FIREBASE ACCOUNT
                 */

                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                /*
                 * SAVE MINECRAFT NAME
                 * IN FIREBASE AUTH PROFILE
                 */

                await updateProfile(
                    user,
                    {
                        displayName:
                            minecraftData.username
                    }
                );


                /*
                 * SEND EMAIL VERIFICATION
                 */

                await sendEmailVerification(user);


                /*
                 * TEMPORARY PROFILE STORAGE
                 *
                 * Later we will move this to
                 * Firebase database.
                 */

                const profileData = {

                    minecraftName:
                        minecraftData.username,

                    uuid:
                        minecraftData.uuid,

                    accountType:
                        minecraftData.accountType,

                    region:
                        region,

                    email:
                        email
                };


                localStorage.setItem(
                    "rotierlist_profile",
                    JSON.stringify(profileData)
                );


                /*
                 * SUCCESS
                 */

                showMessage(
                    "Account created! Check your email to verify your account.",
                    "success"
                );


                /*
                 * REDIRECT
                 */

                setTimeout(
                    () => {
                        window.location.href =
                            "login.html";
                    },
                    1800
                );

            }

            catch (error) {

                console.error(error);


                let errorMessage =
                    "Something went wrong.";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    errorMessage =
                        "This email is already registered.";
                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Please enter a valid email address.";
                }

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    errorMessage =
                        "Your password is too weak.";
                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "Network error. Please try again.";
                }


                showMessage(
                    errorMessage,
                    "error"
                );


                registerButton.disabled = false;

                registerButton.textContent =
                    "Create Account";
            }

        }
    );

</script>


<script
    type="module"
    src="./auth-ui.js">
</script>

</body>
</html>
